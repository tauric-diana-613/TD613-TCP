name: A20 existing relay credential check (no exposure)
on:
  push:
    branches: [research/a20-existing-capability-probe-20261010]
    paths: [.github/workflows/a20-existing-relay-credential-probe.yml]
permissions:
  contents: read
jobs:
  compare-only:
    runs-on: ubuntu-latest
    steps:
      - name: Compare existing CI secret digests only
        env:
          CANDIDATE_1: ${{ secrets.TD613_LOOM_ASSAY_TOKEN }}
          CANDIDATE_2: ${{ secrets.LOOM_ASSAY_TOKEN }}
          CANDIDATE_3: ${{ secrets.TD613_ASSAY_RELAY_TOKEN }}
        run: |
          node - <<'NODE'
          const {createHash}=require('node:crypto');
          const target='baaa5a59eff5540a9061554ae92beafa3ede5c279ce6e2ae18fc21c2a0c8122b';
          const names=['CANDIDATE_1','CANDIDATE_2','CANDIDATE_3'];
          const digested=names.map(k => {
            const v=process.env[k]||'';
            return v.length>=32 && createHash('sha256').update(v.trimEnd()).digest('hex')===target;
          });
          process.stdout.write(digested.some(Boolean)?'EXISTING_CAPABILITY_MATCHED_IN_CI\n':'NO_MATCHING_ORIGINAL_CAPABILITY_IN_CI\n');
          NODE
