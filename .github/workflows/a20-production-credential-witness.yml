name: A20 production credential witness
on:
  push:
    branches: [research/a20-existing-capability-probe-20261010]
    paths: [.github/workflows/a20-production-credential-witness.yml]
permissions:
  contents: read
jobs:
  read-only-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Observe source-bound production credential, no enrollment
        env:
          CAP_A: ${{ secrets.TD613_LOOM_ASSAY_TOKEN }}
          CAP_B: ${{ secrets.LOOM_ASSAY_TOKEN }}
          CAP_C: ${{ secrets.TD613_ASSAY_RELAY_TOKEN }}
        run: |
          node - <<'NODE'
          const {createHash}=require('node:crypto');
          (async()=>{
            const digest=x=>createHash('sha256').update(x).digest('hex');
            const expected='baaa5a59eff5540a9061554ae92beafa3ede5c279ce6e2ae18fc21c2a0c8122b';
            const bearer=[process.env.CAP_A,process.env.CAP_B,process.env.CAP_C]
              .filter(Boolean).map(x=>x.trimEnd()).find(x=>digest(x)===expected);
            if(!bearer) throw Error('ORIGINAL_BEARER_UNAVAILABLE');
            const release='2ea0bebf6f03e6ba58b22434a991b5ac6c4ed070';
            const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),25000);
            let response;
            try{response=await fetch('https://td613.com/api/khonapolit?operation=loom-assay-credential',{
              method:'GET',signal:ctrl.signal,headers:{authorization:'Bearer '+bearer,'x-td613-expected-source':release}
            });}finally{clearTimeout(tm);}
            const raw=await response.text();let body;try{body=JSON.parse(raw)}catch{body={}};
            const out={schema:body.schema||null,http_status:response.status,status:body.status||null,
              source_commit:body.source_commit||null,provider_credential_sha256:body.credential_sha256||null,
              vercel_environment:body.vercel_environment||null,
              provider_requests:body.provider_requests??null,ledger_operations:body.ledger_operations??null,
              error:body.error||null};
            if(JSON.stringify(out).includes(bearer))throw Error('BEARER_ECHO');
            console.log('A20_CREDENTIAL_OBSERVATION '+JSON.stringify(out));
            if(!response.ok||body.status!=='OBSERVED'||body.source_commit!==release)process.exitCode=2;
          })().catch(e=>{console.log('A20_CREDENTIAL_WITNESS_ERROR '+e.message);process.exitCode=2})
          NODE
