name: Aperture v3.2 Exact Transport

on:
  push:
    branches:
      - aperture/v32-identity-singularity-witness-v0-1-20260907
    paths:
      - .github/workflows/aperture-v32-exact-transport.yml

permissions:
  contents: write

concurrency:
  group: aperture-v32-exact-transport
  cancel-in-progress: false

jobs:
  apply-exact-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact WebKit runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          branch='aperture/v32-identity-singularity-witness-v0-1-20260907'
          source_blob='0ea7ca1a58dcc18b37d06663b3bf2106527ea720'
          target_blob='ba3c416d6f72350f5d04b5cb6b796d45cf353ebf'
          target_sha256='c08cbc302c70c742647127b19aceff6755609cf6df41c3d4f7d18b55be12ca88'
          patch='docs/aperture/v3.2-alpha/APERTURE_V32_WEBKIT_RUNTIME_HARDENING_EXACT.patch'

          test "$(git branch --show-current)" = "$branch"
          test "$(git hash-object app/aperture/tool.html)" = "$source_blob"
          git apply --check "$patch"
          git apply "$patch"
          test "$(git hash-object app/aperture/tool.html)" = "$target_blob"
          test "$(sha256sum app/aperture/tool.html | awk '{print $1}')" = "$target_sha256"
          node tests/aperture-v32-identity-lifecycle-diagnostics.test.mjs
          git diff --check
          test "$(git diff --name-only)" = 'app/aperture/tool.html'

          git config user.name 'TD613 exact transport'
          git config user.email 'td613-exact-transport@users.noreply.github.com'
          git add app/aperture/tool.html
          git commit -m 'fix(aperture): harden WebKit runtime scheduling'
          test "$(git show --pretty='' --name-only HEAD)" = 'app/aperture/tool.html'
          git push origin "HEAD:$branch"
