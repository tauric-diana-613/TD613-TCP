name: Aperture v3.2 WebKit frame-sync transport

on:
  push:
    branches:
      - aperture/v32-identity-singularity-witness-v0-1-20260907
    paths:
      - .github/workflows/aperture-v32-webkit-frame-sync-transport.yml

permissions:
  contents: write

jobs:
  apply-exact-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aperture/v32-identity-singularity-witness-v0-1-20260907
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source, apply exact patch, verify target, and push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/aperture/tool.html)" = "ba3c416d6f72350f5d04b5cb6b796d45cf353ebf"
          git apply --check docs/aperture/v3.2-alpha/APERTURE_V32_WEBKIT_FRAME_SYNC_REDUCED_MOTION.patch
          git apply docs/aperture/v3.2-alpha/APERTURE_V32_WEBKIT_FRAME_SYNC_REDUCED_MOTION.patch
          test "$(git hash-object app/aperture/tool.html)" = "3600f1edba194a5288b19bb94b97c01309be8720"
          test "$(git diff --name-only | tr -d '\r')" = "app/aperture/tool.html"
          git diff --check
          git config user.name "td613-actions-transport"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/aperture/tool.html
          git commit -m "fix(aperture): pause module frame sync under reduced motion"
          git push origin HEAD:aperture/v32-identity-singularity-witness-v0-1-20260907
