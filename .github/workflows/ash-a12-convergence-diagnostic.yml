name: Ash A12 convergence diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ash-a12-convergence-diagnostic
  cancel-in-progress: true

jobs:
  bounded-convergence:
    if: github.event.pull_request.head.ref == 'agent/ash-a12-command-rationalization'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact A12 head
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium witness runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium
      - name: Start bounded local Ash runtime
        run: |
          mkdir -p artifacts
          node scripts/ash-keep-local-closure-server.mjs 6130 > artifacts/ash-a12-convergence-server.log 2>&1 &
          echo $! > artifacts/ash-a12-convergence-server.pid
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:6130/__ash_keep_closure/readiness > artifacts/ash-a12-convergence-readiness.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/ash-a12-convergence-server.log || true
          exit 1
      - name: Run convergence with six-minute evidence ceiling
        env:
          TD613_BASE_URL: http://127.0.0.1:6130
          TD613_ARTIFACT_DIR: artifacts/ash-a12-convergence-diagnostic
        run: timeout --foreground --signal=INT --kill-after=15s 360s node scripts/run-ash-constitutional-convergence-handshake.mjs
      - name: Preserve bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ash-a12-convergence-diagnostic-evidence
          path: |
            artifacts/ash-a12-convergence-diagnostic/
            artifacts/ash-a12-convergence-server.log
            artifacts/ash-a12-convergence-readiness.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stop bounded local runtime
        if: always()
        run: test -f artifacts/ash-a12-convergence-server.pid && kill "$(cat artifacts/ash-a12-convergence-server.pid)" || true
