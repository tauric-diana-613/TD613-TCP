name: Ash A12 profile selector compatibility repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ash-a12-profile-selector-compat
  cancel-in-progress: false

jobs:
  repair-test-publish:
    if: github.event.pull_request.head.ref == 'agent/ash-a12-command-rationalization'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact A12 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect completed compatibility repair
        id: state
        run: |
          if grep -q 'data-command-action="profile"' app/dome-world/ash-a12-command-rationalization.js; then
            echo 'repaired=true' >> "$GITHUB_OUTPUT"
          else
            echo 'repaired=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.state.outputs.repaired != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        if: steps.state.outputs.repaired != 'true'
        run: npm ci
      - name: Restore stable selector identity
        if: steps.state.outputs.repaired != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          module = Path('app/dome-world/ash-a12-command-rationalization.js')
          source = module.read_text()
          before = '<button type="button" data-a12-action="profile"><strong>Cases & Profiles</strong>'
          after = '<button type="button" data-a12-action="profile" data-command-action="profile"><strong>Cases & Profiles</strong>'
          if source.count(before) != 1:
              raise SystemExit(f'Expected one A12 profile control marker, observed {source.count(before)}')
          module.write_text(source.replace(before, after))

          test = Path('tests/ash-a12-command-rationalization.test.mjs')
          text = test.read_text()
          marker = "assert.match(moduleSource, /data-command-action=\\\"profile\\\"/);"
          if marker not in text:
              anchor = "assert.match(moduleSource, /human_closure_required:true/);"
              if anchor not in text:
                  raise SystemExit('A12 contract insertion anchor missing')
              text = text.replace(anchor, anchor + '\n' + marker)
              test.write_text(text)
          PY
      - name: Validate static and inherited contracts
        if: steps.state.outputs.repaired != 'true'
        run: |
          set -euo pipefail
          node --check app/dome-world/ash-a12-command-rationalization.js
          node tests/ash-a12-command-rationalization.test.mjs
          node tests/ash-a2-a5-whole-instrument.test.mjs
          node tests/ash-a9-work-recompilation.test.mjs
          node tests/ash-a10-choir-recompilation.test.mjs
          node tests/ash-a11-capsule-recompilation.test.mjs
          node tests/tcp-smoke.test.mjs
          git diff --check
      - name: Install Firefox witness runtime
        if: steps.state.outputs.repaired != 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps firefox
      - name: Start bounded local Ash runtime
        if: steps.state.outputs.repaired != 'true'
        run: |
          mkdir -p artifacts
          node scripts/ash-keep-local-closure-server.mjs 6130 > artifacts/a12-profile-compat-server.log 2>&1 &
          echo $! > artifacts/a12-profile-compat-server.pid
          for attempt in $(seq 1 50); do
            if curl -fsS --max-time 2 http://127.0.0.1:6130/__ash_keep_closure/readiness > artifacts/a12-profile-compat-readiness.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/a12-profile-compat-server.log || true
          exit 1
      - name: Re-run inherited Firefox A2-A6 journey
        if: steps.state.outputs.repaired != 'true'
        env:
          TD613_BROWSER: firefox
          TD613_BASE_URL: http://127.0.0.1:6130
          TD613_ARTIFACT_DIR: artifacts/ash-a12-profile-compat-firefox
        run: timeout --foreground --signal=INT --kill-after=15s 540s node scripts/ash-a2-a5-browser-probe.mjs
      - name: Stop bounded local runtime
        if: always() && steps.state.outputs.repaired != 'true'
        run: test -f artifacts/a12-profile-compat-server.pid && kill "$(cat artifacts/a12-profile-compat-server.pid)" || true
      - name: Preserve repair evidence
        if: always() && steps.state.outputs.repaired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ash-a12-profile-selector-compat-evidence
          path: |
            artifacts/ash-a12-profile-compat-firefox/
            artifacts/a12-profile-compat-server.log
            artifacts/a12-profile-compat-readiness.json
          if-no-files-found: warn
          retention-days: 45
      - name: Commit tested compatibility repair
        if: steps.state.outputs.repaired != 'true'
        run: |
          set -euo pipefail
          git config user.name 'td613-ash-a12-compat-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dome-world/ash-a12-command-rationalization.js tests/ash-a12-command-rationalization.test.mjs
          git diff --cached --check
          git commit -m 'Repair A12 profile selector compatibility'
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
      - name: Confirm quiescence
        if: steps.state.outputs.repaired == 'true'
        run: echo 'A12 profile selector compatibility already repaired.'
