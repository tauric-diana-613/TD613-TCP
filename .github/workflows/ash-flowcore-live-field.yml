name: Ash Flow-Core Live Field

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/dome-world-shell.js'
      - 'app/safe-harbor/ash-keep-recovery.html'
      - 'app/dome-world/ash-*'
      - 'app/dome-world/docs/ASH_KEEP_*'
      - 'app/dome-world/fixtures/ash-*'
      - 'app/dome-world/schemas/ash-*'
      - 'app/engine/ash-*'
      - 'app/aperture/release.*'
      - 'docs/ASH_*'
      - 'scripts/ash-*'
      - 'scripts/run-ash-*'
      - 'tests/ash-*'
      - 'tests/product-architecture/shell.test.mjs'
      - 'tests/workflow-estate.test.mjs'
      - 'tests/vercel-operator-release-gate.test.mjs'
      - '.github/workflows/ash-flowcore-live-field.yml'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: td613-ash-program-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

jobs:
  program-validation:
    name: Ash program exact-head validation
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies once
        run: npm ci
      - name: Syntax-check Ash product and witness graph
        run: |
          set -euo pipefail
          node --check api/dome-world-shell.js
          node --check app/dome-world/ash-demo-registry-preflight.js
          node --check app/dome-world/ash-demo-registry.js
          node --check app/dome-world/ash-profile-demo-hydration.js
          node --check app/dome-world/ash-workspace-bridge.js
          node --check app/dome-world/ash-a7-a11-recompiler-core.js
          node --check app/dome-world/ash-a7-home-recompilation.js
          node --check app/dome-world/ash-a8-case-map-recompilation.js
          node --check app/dome-world/ash-a9-work-recompilation.js
          node --check app/dome-world/ash-a10-choir-recompilation.js
          node --check app/dome-world/ash-a11-capsule-recompilation.js
          node --check app/dome-world/ash-a12-command-rationalization.js
          node --check scripts/ash-keep-local-closure-server.mjs
          node --check scripts/ash-a2-a5-browser-probe.mjs
          node --check scripts/ash-a7-a11-browser-probe.mjs
          node --check scripts/ash-a12-browser-probe.mjs
          node --check scripts/ash-a13-browser-probe.mjs
          node --check scripts/run-ash-flowcore-live-field-browser-probe.mjs
          node --check scripts/ash-ingress-polish-browser-probe.mjs
          node --check scripts/ash-reviewability-browser-probe.mjs
          node --check scripts/ash-research-ux-browser-probe.mjs
          node --check scripts/run-ash-keep-a1-production-probe.mjs
          node --check scripts/run-ash-constitutional-convergence-handshake.mjs
          node --check scripts/ash-keep-aia3-task-journey-v3.mjs
          node --check scripts/ash-lifecycle-production-probe.mjs
      - name: Run consolidated static and authority contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            node tests/workflow-estate.test.mjs
            node tests/vercel-operator-release-gate.test.mjs
            node tests/ash-a2-a5-whole-instrument.test.mjs
            node tests/ash-a7-home-recompilation.test.mjs
            node tests/ash-a8-case-map-recompilation.test.mjs
            node tests/ash-a9-work-recompilation.test.mjs
            node tests/ash-a10-choir-recompilation.test.mjs
            node tests/ash-a11-capsule-recompilation.test.mjs
            node tests/ash-a11-postclosure-cache-eviction.test.mjs
            node tests/ash-a12-command-rationalization.test.mjs
            node tests/ash-a13-unified-demo-registry.test.mjs
            node tests/ash-flowcore-live-field.test.mjs
            node tests/ash-ingress-polish.test.mjs
            node tests/ash-aia3-mass-eviction.test.mjs
            node tests/ash-live-ingress-demos-cache.test.mjs
            node tests/product-architecture/shell.test.mjs
            node tests/ash-reviewability.test.mjs
            node tests/ash-research-ux-rehydration.test.mjs
            node tests/ash-final-rehydration-boundaries.test.mjs
            node tests/ash-four-profile-pedagogy.test.mjs
            node tests/ash-profile-demos.test.mjs
            node tests/ash-keep-production-closure-contract.test.mjs
            node tests/ash-lifecycle-production-contract.test.mjs
            node tests/ash-keep-production-promotion-gate.test.mjs
            node scripts/assert-ash-keep-release-posture.mjs
            npm run test:ash-keep
            node tests/ash-lifecycle.test.mjs
            node tests/ash-draft-lifecycle-binding.test.mjs
            node tests/ash-product-architecture.test.mjs
            node --test tests/flowcore-pedagogue-visual.test.mjs
            node tests/ash-keep-live-aia-surface.test.mjs
            node tests/ash-keep-ingress-readiness-close-boundary.test.mjs
            node tests/tcp-smoke.test.mjs
          } 2>&1 | tee artifacts/ash-program-contracts.log
      - name: Install one bounded three-browser witness runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Start one bounded local Ash runtime
        run: |
          set -euo pipefail
          node scripts/ash-keep-local-closure-server.mjs 6130 > artifacts/ash-program-server.log 2>&1 &
          echo $! > artifacts/ash-program-server.pid
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:6130/__ash_keep_closure/readiness > artifacts/ash-program-readiness.json; then
              cat artifacts/ash-program-readiness.json
              exit 0
            fi
            sleep 1
          done
          cat artifacts/ash-program-server.log || true
          exit 1
      - name: Run Chromium, Firefox, and WebKit sequentially on one runner
        env:
          TD613_BASE_URL: http://127.0.0.1:6130
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            export TD613_BROWSER="$browser"
            TD613_ARTIFACT_DIR="artifacts/ash-a2-a5-$browser" timeout --foreground --signal=INT --kill-after=15s 540s node scripts/ash-a2-a5-browser-probe.mjs
            TD613_ASH_STAGES=A7,A8,A9,A10,A11 TD613_ARTIFACT_DIR="artifacts/ash-a7-a11-$browser" timeout --foreground --signal=INT --kill-after=15s 540s node scripts/ash-a7-a11-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/ash-a12-$browser" timeout --foreground --signal=INT --kill-after=15s 420s node scripts/ash-a12-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/ash-a13-$browser" timeout --foreground --signal=INT --kill-after=15s 420s node scripts/ash-a13-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/ash-flowcore-$browser" timeout --foreground --signal=INT --kill-after=15s 480s node scripts/run-ash-flowcore-live-field-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/ash-ingress-$browser" timeout --foreground --signal=INT --kill-after=15s 360s node scripts/ash-ingress-polish-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/ash-reviewability-$browser" timeout --foreground --signal=INT --kill-after=15s 420s node scripts/ash-reviewability-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/ash-research-$browser" timeout --foreground --signal=INT --kill-after=15s 480s node scripts/ash-research-ux-browser-probe.mjs
          done
      - name: Run core closure and constitutional convergence once
        env:
          TD613_BASE_URL: http://127.0.0.1:6130
          TD613_ARTIFACT_DIR: artifacts/ash-production-closure
          TD613_PROBE_RUNTIME_DIR: artifacts/ash-probe-runtime
        run: |
          set -euo pipefail
          timeout --foreground --signal=INT --kill-after=15s 540s node scripts/run-ash-keep-a1-production-probe.mjs
          TD613_ARTIFACT_DIR=artifacts/ash-constitutional-convergence timeout --foreground --signal=INT --kill-after=15s 360s node scripts/run-ash-constitutional-convergence-handshake.mjs
      - name: Preserve consolidated Ash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ash-program-exact-head-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Stop bounded local runtime
        if: always()
        run: |
          if [ -f artifacts/ash-program-server.pid ]; then
            kill "$(cat artifacts/ash-program-server.pid)" 2>/dev/null || true
          fi

  deployed-observation:
    name: Ash exact-source production observation
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 405 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/td613-ash-aia3-observe ')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_GATE_ISSUE: '405'
      TD613_CANONICAL_PRODUCTION_URL: https://td613.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current observer harness with source history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate exact read-only observation command
        id: authorize
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r COMMAND TARGET SELECTED_SHA EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-ash-aia3-observe' ]] || { echo 'Unexpected observation command.' >&2; exit 1; }
          [[ "$TARGET" == 'PRODUCTION' ]] || { echo 'Only the named PRODUCTION target is accepted.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" ]] || { echo 'Observation command must contain exactly command, target, and SHA.' >&2; exit 1; }
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Observation command omitted a 40-character SHA.' >&2; exit 1; }
          git cat-file -e "$SELECTED_SHA^{commit}"
          git merge-base --is-ancestor "$SELECTED_SHA" HEAD || { echo 'Selected application source is not an ancestor of current main.' >&2; exit 1; }
          HARNESS_SHA="$(git rev-parse HEAD)"
          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "harness_sha=$HARNESS_SHA" >> "$GITHUB_OUTPUT"
      - name: Record accepted read-only observation
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="𝌋 Ash AIA3 and lifecycle observation accepted. application_source_commit=${{ steps.authorize.outputs.selected_sha }} · observer_harness_commit=${{ steps.authorize.outputs.harness_sha }} · deployment_count=0 · repository_write_authority=false · run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ⟐"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install one production witness runtime
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Publish pending status on selected source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TD613_OBSERVED_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_OBSERVER_STATUS_STATE: pending
          TD613_OBSERVER_STATUS_DESCRIPTION: Ash exact-source observation is running
          TD613_OBSERVER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TD613_OBSERVER_STATUS_CONTEXT: Ash Lifecycle Deployed Observation
          TD613_OBSERVER_STATUS_RECEIPT_PATH: artifacts/ash-lifecycle-production/observer-status-pending.json
        run: |
          mkdir -p artifacts/ash-lifecycle-production
          node scripts/publish-ash-keep-observer-status.mjs
      - name: Observe exact deployed AIA3 and lifecycle
        env:
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_PRODUCTION_OBSERVATION: 'true'
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            TD613_BROWSER="$browser" TD613_ARTIFACT_DIR="artifacts/ash-aia3-production/$browser" node scripts/ash-keep-aia3-task-journey-v3.mjs
          done
          TD613_ARTIFACT_DIR=artifacts/ash-lifecycle-production node scripts/ash-lifecycle-production-probe.mjs
      - name: Verify bounded production receipts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected = '${{ steps.authorize.outputs.selected_sha }}';
          for (const browser of ['chromium', 'firefox', 'webkit']) {
            const receipt = JSON.parse(fs.readFileSync(`artifacts/ash-aia3-production/${browser}/ash-aia3-task-continuity.json`, 'utf8'));
            if (receipt.status !== 'PASS') throw new Error(`${browser} AIA3 production journey held.`);
            if (receipt.source_packet_commit !== expected) throw new Error(`${browser} AIA3 source-packet label drifted.`);
            if (receipt.production_observation !== true) throw new Error(`${browser} was not marked as production observation.`);
            const authority = receipt.authority || {};
            if (authority.counts_as_human_evidence !== false || authority.authorizes_child_study !== false || authority.authorizes_release !== false || authority.closes_program !== false) {
              throw new Error(`${browser} AIA3 observer widened authority.`);
            }
          }
          const lifecycle = JSON.parse(fs.readFileSync('artifacts/ash-lifecycle-production/ash-lifecycle-production-closure.json', 'utf8'));
          if (lifecycle.status !== 'PASS') throw new Error(`Lifecycle production journey held: ${lifecycle.status}`);
          if (lifecycle.source_status !== 'DEPLOYED_OBSERVATION') throw new Error(`Unexpected lifecycle source status: ${lifecycle.source_status}`);
          if (lifecycle.promotion_authorized !== false) throw new Error('Lifecycle observer widened promotion authority.');
          if (lifecycle.threshold?.specialist_cache_preflight?.legacy_bypass !== true) throw new Error('Lifecycle observer did not prove exact legacy bypass.');
          if (lifecycle.threshold?.specialist_cache_preflight?.aia3_route_required !== false) throw new Error('Lifecycle observer restored an AIA3 route requirement inside legacy presentation.');
          if (lifecycle.network?.disallowed_non_read_requests?.length) throw new Error('Lifecycle observer emitted disallowed non-read requests.');
          if (lifecycle.network?.provider_or_transport_requests?.length) throw new Error('Lifecycle observer reached provider or recipient transport.');
          if (lifecycle.continuity?.lifecycle_state !== 'CONTINUITY_SEALED') throw new Error('Lifecycle observer did not reach continuity-sealed state.');
          NODE
      - name: Publish terminal observer status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TD613_OBSERVED_COMMIT: ${{ steps.authorize.outputs.selected_sha || 'unresolved' }}
          TD613_OBSERVER_STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          TD613_OBSERVER_STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Ash exact-source observation passed' || 'Ash exact-source observation held' }}
          TD613_OBSERVER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TD613_OBSERVER_STATUS_CONTEXT: Ash Lifecycle Deployed Observation
          TD613_OBSERVER_STATUS_RECEIPT_PATH: artifacts/ash-lifecycle-production/observer-status-terminal.json
        run: node scripts/publish-ash-keep-observer-status.mjs
      - name: Preserve production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ash-exact-source-production-observation
          path: |
            artifacts/ash-aia3-production/
            artifacts/ash-lifecycle-production/
          if-no-files-found: warn
          retention-days: 45
      - name: Seal observation result
        if: always()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="𝌋 Ash exact-source production observation ${{ job.status }}. application_source_commit=${{ steps.authorize.outputs.selected_sha || 'unresolved' }} · deployment_count=0 · counts_as_human_evidence=false · child_study_authorized=false · release_authorized=false · human_closure_required=true · run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ⟐"
