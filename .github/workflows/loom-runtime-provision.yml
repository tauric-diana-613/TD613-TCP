name: TD613 Loom Runtime Provisioning

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  provision:
    if: >
      github.event.issue.number == 737 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.user.login == github.repository_owner ||
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
      startsWith(github.event.comment.body, '/td613-provision-loom-runtime ')
    runs-on: ubuntu-latest
    env:
      EXPECTED_PR: '1399'
      EXPECTED_PR_SHA: '8ee69e58fb7d06251302c749426249135247cfbb'
      VERCEL_PROJECT: td-613-tcp
      VERCEL_SCOPE: tauric-diana-s-projects
      BRIDGE_URL: https://br-round-union-b5v3ludi-loomprov.compute.c-7.us-east-2.aws.neon.tech/
      BRIDGE_AUDIENCE: td613-loom-provision-v1
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Authorize bounded Westward Liberties provisioning
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r COMMAND TARGET SELECTED_SHA EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-provision-loom-runtime' ]] || { echo 'Unexpected provisioning command.' >&2; exit 1; }
          [[ "$TARGET" == 'PRODUCTION' ]] || { echo 'Only PRODUCTION is accepted.' >&2; exit 1; }
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a 40-character SHA.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" ]] || { echo 'Unexpected extra command material.' >&2; exit 1; }
          [[ "$SELECTED_SHA" == "$EXPECTED_PR_SHA" ]] || { echo 'Command SHA does not match the bounded source candidate.' >&2; exit 1; }
          [[ -n "${VERCEL_TOKEN:-}" ]] || { echo 'VERCEL_TOKEN is unavailable.' >&2; exit 1; }

          ISSUE_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/issues/737" --jq '.state')"
          [[ "$ISSUE_STATE" == 'open' ]] || { echo 'Westward Liberties issue #737 is not active.' >&2; exit 1; }

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}")"
          [[ "$(jq -r '.state' <<< "$PR_JSON")" == 'open' ]] || { echo 'PR #1399 is not open.' >&2; exit 1; }
          [[ "$(jq -r '.draft' <<< "$PR_JSON")" == 'true' ]] || { echo 'PR #1399 must remain Draft during provisioning.' >&2; exit 1; }
          [[ "$(jq -r '.head.sha' <<< "$PR_JSON")" == "$EXPECTED_PR_SHA" ]] || { echo 'PR #1399 head moved.' >&2; exit 1; }

      - name: Provision Loom Production runtime custody
        run: |
          set -euo pipefail
          [[ "$BRIDGE_URL" != 'https://br-round-union-b5v3ludi-loomprov.compute.c-7.us-east-2.aws.neon.tech/' ]] || { echo 'Neon OIDC bridge has not been armed.' >&2; exit 1; }

          OIDC_JSON="$(curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${BRIDGE_AUDIENCE}")"
          OIDC_TOKEN="$(jq -er '.value' <<< "$OIDC_JSON")"
          echo "::add-mask::$OIDC_TOKEN"

          umask 077
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H 'Content-Type: application/json'             "$BRIDGE_URL"             -o /tmp/td613-loom-runtime.json

          DB_URL="$(jq -er '.database_url' /tmp/td613-loom-runtime.json)"
          SIGNING_SECRET="$(jq -er '.signing_secret' /tmp/td613-loom-runtime.json)"
          [[ "$DB_URL" == postgresql://* || "$DB_URL" == postgres://* ]] || { echo 'Neon bridge returned an invalid database URL.' >&2; exit 1; }
          [[ "${#SIGNING_SECRET}" -ge 43 ]] || { echo 'Neon bridge returned an undersized signing secret.' >&2; exit 1; }
          echo "::add-mask::$DB_URL"
          echo "::add-mask::$SIGNING_SECRET"

          BODY="$(jq -cn             --arg db "$DB_URL"             --arg sig "$SIGNING_SECRET"             '[
              {
                key:"TD613_LOOM_DEMO_NEON_DATABASE_URL",
                value:$db,
                type:"sensitive",
                target:["production"],
                comment:"TD613 Loom durable-head custody · Westward Liberties #737"
              },
              {
                key:"TD613_LOOM_DEMO_SIGNING_SECRET",
                value:$sig,
                type:"sensitive",
                target:["production"],
                comment:"TD613 Loom stage-receipt signer · Westward Liberties #737"
              }
            ]')"

          HTTP_CODE="$(curl --silent --show-error             -o /tmp/vercel-upsert.json             -w '%{http_code}'             -X POST             "https://api.vercel.com/v10/projects/${VERCEL_PROJECT}/env?upsert=true&slug=${VERCEL_SCOPE}"             -H "Authorization: Bearer ${VERCEL_TOKEN}"             -H 'Content-Type: application/json'             --data-binary "$BODY")"
          [[ "$HTTP_CODE" == '200' || "$HTTP_CODE" == '201' ]] || {
            echo "Vercel environment upsert failed with HTTP $HTTP_CODE." >&2
            exit 1
          }

          curl --fail --silent --show-error             "https://api.vercel.com/v10/projects/${VERCEL_PROJECT}/env?slug=${VERCEL_SCOPE}"             -H "Authorization: Bearer ${VERCEL_TOKEN}"             -H 'Content-Type: application/json'             -o /tmp/vercel-envs.json

          jq -e '
            def ok($k):
              [.envs[] | select(.key == $k and .type == "sensitive" and ((.target // []) | index("production")) != null)] | length == 1;
            ok("TD613_LOOM_DEMO_NEON_DATABASE_URL") and
            ok("TD613_LOOM_DEMO_SIGNING_SECRET")
          ' /tmp/vercel-envs.json >/dev/null

          rm -f /tmp/td613-loom-runtime.json /tmp/vercel-upsert.json /tmp/vercel-envs.json
          echo 'Loom Production runtime custody variables are present as Sensitive / Production-only Vercel configuration.'

      - name: Record bounded provisioning receipt
        env:
          SOURCE_SHA: ${{ env.EXPECTED_PR_SHA }}
        run: |
          set -euo pipefail
          gh issue comment 737 --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          𝌋

          Westward Liberties #737 provisioning receipt.

          ```text
          source_pr       = #1399
          source_sha      = $SOURCE_SHA
          neon_head_store = configured
          loom_signer     = configured
          vercel_target   = Production only
          secret_type     = Sensitive
          deployment      = 0
          merge           = 0
          #405            = 0
          ```

          No secret values were emitted.

          Marked ⟐
          EOF
          )"
