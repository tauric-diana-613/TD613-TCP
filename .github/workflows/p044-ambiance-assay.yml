name: P-044 Ambiance Boundary Assay

on:
  pull_request:
    paths:
      - 'tests/p044-ambiance-coupling.test.mjs'
      - 'docs/research/wolfram-rule-atlas/**'
      - 'package.json'
      - '.github/workflows/p044-ambiance-assay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-rca-01:
    name: RCA-01 bounded simulator/falsification assay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the exact-head bounded ambiance assay
        run: npm run test:ambiance
