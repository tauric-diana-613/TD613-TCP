name: SRC Multi-Platform Sync

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: td613-src-multiplatform-sync
  cancel-in-progress: false

jobs:
  src-sync:
    if: >-
      github.event.issue.number == 758 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.user.login == github.repository_owner || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
      github.event.comment.body == '/src-sync ATELIER'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GATE_ISSUE: '758'
      ATELIER_PR: '731'
      ATELIER_BRANCH: amari/src-projective-routing-grammar
      SRC_ROOT: packages/dome_world_exact/fixtures/a15-r0/SRC
      CREATOR_ORCID: 0009-0009-9348-3534
      ZENODO_SUMMARY: /tmp/src-zenodo-sync-summary.json
      PLATFORM_SUMMARY: /tmp/src-platform-sync-summary.json
      COMBINED_SUMMARY: /tmp/src-sync-summary.json

    steps:
      - name: Record accepted multi-platform SRC sync gesture
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 SRC multi-platform sync gesture accepted.

          \`\`\`text
          command = /src-sync ATELIER
          relay = ${{ github.event.comment.user.login }}
          target_branch = $ATELIER_BRANCH
          target_pr = #$ATELIER_PR
          zenodo_discovery = exact creator ORCID
          substack_discovery = bounded RSS + public reachability
          medium_discovery = bounded RSS + public reachability
          academia_discovery = explicit adapter; completeness required before a complete-delta claim
          run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          authority = one bounded live/post-seal multi-platform delta census
          \`\`\`

          Platform differences remain typed. PRIVATE_ONLY HTML is never republished into the public fixture. No merge, scientific-core mutation, publication, production, or release authority is created. ⟐
          EOF_COMMENT
          )"

      - name: Verify configured live Atelier surface
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ATELIER_PR")"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          MERGED="$(jq -r '.merged' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          [[ "$STATE" == 'open' ]] || { echo "Atelier PR #$ATELIER_PR is not open." >&2; exit 1; }
          [[ "$MERGED" == 'false' ]] || { echo "Atelier PR #$ATELIER_PR is merged; rotate the gate target." >&2; exit 1; }
          [[ "$HEAD_REF" == "$ATELIER_BRANCH" ]] || { echo "Atelier branch mismatch: $HEAD_REF != $ATELIER_BRANCH" >&2; exit 1; }

      - name: Check out gate implementation from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stage immutable operator implementations outside target worktree
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 scripts/src-zenodo-operator-sync.py /tmp/src-zenodo-operator-sync.py
          install -m 0755 scripts/src-platform-operator-sync.py /tmp/src-platform-operator-sync.py
          python -m py_compile /tmp/src-zenodo-operator-sync.py /tmp/src-platform-operator-sync.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded PDF text extractor
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<7'

      - name: Check out live Atelier target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$ATELIER_BRANCH"
          git checkout -B "$ATELIER_BRANCH" "origin/$ATELIER_BRANCH"

      - name: Freeze pre-sync custody witnesses
        id: before
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "phase2_tree=$(git rev-parse HEAD:$SRC_ROOT/04-RECEIPTS/phase2)" >> "$GITHUB_OUTPUT"
          echo "phase2_manifest_tree=$(git rev-parse HEAD:$SRC_ROOT/01-MANIFESTS/phase2)" >> "$GITHUB_OUTPUT"

      - name: Run exact-creator Zenodo delta
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/src-zenodo-operator-sync.py \
            --root "$SRC_ROOT" \
            --creator-orcid "$CREATOR_ORCID" \
            --run-id "$GITHUB_RUN_ID" \
            --gate-issue "$GATE_ISSUE" \
            --relay-identity '${{ github.event.comment.user.login }}' \
            --atelier-branch "$ATELIER_BRANCH" \
            --summary-path "$ZENODO_SUMMARY"

      - name: Run bounded platform delta census
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/src-platform-operator-sync.py \
            --root "$SRC_ROOT" \
            --run-id "$GITHUB_RUN_ID" \
            --gate-issue "$GATE_ISSUE" \
            --relay-identity '${{ github.event.comment.user.login }}' \
            --atelier-branch "$ATELIER_BRANCH" \
            --summary-path "$PLATFORM_SUMMARY"

      - name: Enforce sealed custody membrane and live-write scope
        shell: bash
        env:
          PHASE2_TREE_BEFORE: ${{ steps.before.outputs.phase2_tree }}
          PHASE2_MANIFEST_TREE_BEFORE: ${{ steps.before.outputs.phase2_manifest_tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD:$SRC_ROOT/04-RECEIPTS/phase2)" == "$PHASE2_TREE_BEFORE" ]]
          [[ "$(git rev-parse HEAD:$SRC_ROOT/01-MANIFESTS/phase2)" == "$PHASE2_MANIFEST_TREE_BEFORE" ]]

          mapfile -t CHANGED < <(git status --porcelain=v1 | sed -E 's/^.. //')
          for path in "${CHANGED[@]}"; do
            case "$path" in
              "$SRC_ROOT/01-MANIFESTS/live/"*|\
              "$SRC_ROOT/02-ORIGINALS/live/"*|\
              "$SRC_ROOT/03-DERIVATIVES/text/live/"*|\
              "$SRC_ROOT/04-RECEIPTS/live/"*) ;;
              *)
                echo "Out-of-scope live sync mutation: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Compose multi-platform receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SRC_ROOT/04-RECEIPTS/live/src-sync-runs"
          jq -n \
            --arg schema 'src-multiplatform-gate-receipt/v1' \
            --arg run "$GITHUB_RUN_ID" \
            --arg before '${{ steps.before.outputs.head }}' \
            --slurpfile zenodo "$ZENODO_SUMMARY" \
            --slurpfile platforms "$PLATFORM_SUMMARY" \
            '{
              schema:$schema,
              run_id:$run,
              before_head:$before,
              zenodo:$zenodo[0],
              platform_census:$platforms[0],
              authority:"ONE_BOUNDED_LIVE_POST_SEAL_DELTA",
              sealed_phase2_mutation:false,
              A15_R0_scientific_mutation:false,
              merge:false,
              publication:false,
              production:false
            }' | tee "$COMBINED_SUMMARY" > "$SRC_ROOT/04-RECEIPTS/live/src-sync-runs/$GITHUB_RUN_ID.json"

      - name: Commit one bounded live-intake packet
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard "$SRC_ROOT")" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "$SRC_ROOT/01-MANIFESTS/live" \
            "$SRC_ROOT/02-ORIGINALS/live" \
            "$SRC_ROOT/03-DERIVATIVES/text/live" \
            "$SRC_ROOT/04-RECEIPTS/live"
          git commit -m "SRC: bounded multi-platform live delta $GITHUB_RUN_ID"
          git push origin "HEAD:$ATELIER_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record completion and return gate dormant
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ZENODO_NEW="$(jq -r '.new_record_count // 0' "$ZENODO_SUMMARY")"
          SUBSTACK_STATE="$(jq -r '.platforms[] | select(.platform=="substack") | .state' "$PLATFORM_SUMMARY")"
          SUBSTACK_NEW="$(jq -r '.platforms[] | select(.platform=="substack") | .new_count' "$PLATFORM_SUMMARY")"
          MEDIUM_STATE="$(jq -r '.platforms[] | select(.platform=="medium") | .state' "$PLATFORM_SUMMARY")"
          MEDIUM_NEW="$(jq -r '.platforms[] | select(.platform=="medium") | .new_count' "$PLATFORM_SUMMARY")"
          ACADEMIA_STATE="$(jq -r '.platforms[] | select(.platform=="academia") | .state' "$PLATFORM_SUMMARY")"
          COMPLETE="$(jq -r '.all_platform_delta_claims_complete' "$PLATFORM_SUMMARY")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 SRC multi-platform sync completed and gate returned DORMANT.

          \`\`\`text
          run = $GITHUB_RUN_ID
          before_head = ${{ steps.before.outputs.head }}
          after_head = ${{ steps.commit.outputs.head }}
          repository_changed = ${{ steps.commit.outputs.changed }}
          zenodo_new_records = $ZENODO_NEW
          substack = $SUBSTACK_STATE / new=$SUBSTACK_NEW
          medium = $MEDIUM_STATE / new=$MEDIUM_NEW
          academia = $ACADEMIA_STATE
          all_platform_delta_claims_complete = $COMPLETE
          target = $ATELIER_BRANCH / PR #$ATELIER_PR
          sealed_phase2_mutation = false
          A15-R0_scientific_mutation = false
          merge = false
          publication = false
          production = false
          \`\`\`

          A platform HOLD means the gate refused to invent a complete delta; it is not evidence of zero new works. Fresh operator authorization is required for another run. Sealed ⟐
          EOF_COMMENT
          )"

      - name: Record hold
        if: failure()
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" \
            -f body="𝌋 SRC multi-platform sync held. No retry, merge, publication, production, scientific mutation, or further sync authority follows. Inspect $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Sealed ⟐"
