name: TD613 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: td613-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Resolve bounded test scope
    runs-on: ubuntu-latest
    outputs:
      ash: ${{ steps.scope.outputs.ash }}
      phase4: ${{ steps.scope.outputs.phase4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "ash=true" >> "$GITHUB_OUTPUT"
            echo "phase4=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$base" "$GITHUB_SHA" | tee changed-files.txt

          ash=false
          phase4=false
          if grep -Eq '^(\.github/workflows/|tests/workflow-estate\.test\.mjs|api/dome-world-shell\.js|app/dome-world/|app/engine/ash-|scripts/(ash-|run-ash-)|tests/ash-|docs/ASH_|ROADMAP\.md|app/aperture/release|tests/fixtures/aperture-release)' changed-files.txt; then
            ash=true
          fi
          if grep -Eq '^(\.github/workflows/|tests/workflow-estate\.test\.mjs|api/dome-world-engine-guard\.py|packages/dome_world_exact/|app/engine/aperture-v3-reciprocal-bridge\.js|app/aperture/|app/dome-world/reciprocal-bridge\.html|app/dome-world/schemas/(aperture|flowcore)-|app/dome-world/docs/PHASE_4_|scripts/phase4-|tests/(aperture-phase4|phase4-)|vercel\.json)' changed-files.txt; then
            phase4=true
          fi
          echo "ash=$ash" >> "$GITHUB_OUTPUT"
          echo "phase4=$phase4" >> "$GITHUB_OUTPUT"

  static:
    name: Static, constitutional, and release law
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check sympy
      - name: Enforce two-workflow estate
        run: node tests/workflow-estate.test.mjs
      - name: Run retained repository suite
        run: npm test
      - name: Run Safe Harbor and Hush retained suites
        run: |
          npm run test:safe-harbor:current
          npm run test:safe-harbor:gen3:wave-b
          npm run test:hush:phase9
          npm run test:hush:phase10
          npm run test:hush:phase11
          npm run test:hush:phase12
          npm run test:hush:phase13
          npm run test:hush:phase14
          npm run test:hush:packets:check
      - name: Run Dome-World and Ash static contracts
        run: |
          npm run test:dome-world:art
          npm run test:dome-world:phase3
          node tests/dome-world-ash-custody.test.mjs
          node tests/dome-world-ash-leak-challenge.test.mjs
          node tests/dome-world-ash-veil.test.mjs
          node tests/dome-world-ash-cinder.test.mjs
          node tests/dome-world-ash-compare.test.mjs
          node tests/dome-world-ash-recall.test.mjs
          node tests/dome-world-ash-hcc-grade-gate.test.mjs
          node tests/ash-keep-core.test.mjs
          node tests/ash-keep-continuity.test.mjs
          node tests/ash-keep-hush-api.test.mjs
          node tests/ash-keep-ui.test.mjs
          node tests/ash-four-profile-pedagogy.test.mjs
          node tests/ash-investigation-guidance.test.mjs
          node tests/ash-legal-ux.test.mjs
          node tests/ash-custodian-return.test.mjs
          node tests/ash-custodian-return-contract.test.mjs
          node tests/ash-custodian-return-closure.test.mjs
          node tests/ash-custodian-return-closure-contract.test.mjs
          node tests/ash-destination-handoff.test.mjs
          node tests/ash-destination-handoff-schemas.test.mjs
          node tests/ash-destination-handoff-ui.test.mjs
          node tests/ash-destination-handoff-closure.test.mjs
          node tests/ash-keep-choir-calibration-schemas.test.mjs
          node tests/flowcore-p0-p7-seam-closure.test.mjs
          node tests/flowcore-p0-p10-completion.test.mjs
          node tests/flowcore-production-observation.test.mjs
          node tests/flowcore-runtime-browser-probe.test.mjs
          node tests/product-architecture/shell.test.mjs
          node tests/product-architecture/lifecycle.test.mjs
      - name: Enforce locked Vercel release law
        run: |
          node tests/vercel-deploy-hygiene.test.mjs
          node tests/vercel-operator-release-gate.test.mjs
          node tests/vercel-relock-safety.test.mjs
          node tests/release-plumbing.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('Vercel Git deployments must remain disabled.');
          NODE

  ash:
    name: Ash local closure and browser field
    needs: scope
    if: needs.scope.outputs.ash == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate current Ash stage contracts
        run: |
          node --check api/dome-world-shell.js
          node --check scripts/ash-keep-local-closure-server.mjs
          node --check scripts/run-ash-keep-a1-production-probe.mjs
          node --check scripts/run-ash-constitutional-convergence-handshake.mjs
          node --check scripts/ash-a2-a5-browser-probe.mjs
          node --check scripts/ash-a7-a11-browser-probe.mjs
          node --check scripts/ash-a12-browser-probe.mjs
          node --check scripts/run-ash-flowcore-live-field-browser-probe.mjs
          node --check scripts/ash-ingress-polish-browser-probe.mjs
          node --check scripts/ash-reviewability-browser-probe.mjs
          node --check scripts/ash-research-ux-browser-probe.mjs
          node tests/ash-a7-home-recompilation.test.mjs
          node tests/ash-a11-postclosure-cache-eviction.test.mjs
          node tests/ash-a12-command-rationalization.test.mjs
          node tests/ash-flowcore-live-field.test.mjs
          node tests/ash-ingress-polish.test.mjs
          node tests/ash-aia3-mass-eviction.test.mjs
          node tests/ash-live-ingress-demos-cache.test.mjs
          node tests/ash-reviewability.test.mjs
          node tests/ash-final-rehydration-boundaries.test.mjs
          node tests/ash-keep-production-promotion-gate.test.mjs
          node scripts/assert-ash-keep-release-posture.mjs
      - name: Install one shared browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Start one bounded Ash runtime
        run: |
          mkdir -p artifacts
          node scripts/ash-keep-local-closure-server.mjs 6130 > artifacts/ash-server.log 2>&1 &
          echo $! > artifacts/ash-server.pid
          for attempt in $(seq 1 50); do
            if curl -fsS --max-time 2 http://127.0.0.1:6130/__ash_keep_closure/readiness > artifacts/ash-readiness.json; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/ash-server.log || true
          exit 1
      - name: Run core closure once
        env:
          TD613_BASE_URL: http://127.0.0.1:6130
          TD613_ARTIFACT_DIR: artifacts/ash-keep-production-closure
          TD613_PROBE_RUNTIME_DIR: artifacts/ash-keep-probe-runtime
        run: |
          node scripts/run-ash-keep-a1-production-probe.mjs
          TD613_ARTIFACT_DIR=artifacts/ash-constitutional-convergence \
            timeout --foreground --signal=INT --kill-after=15s 360s \
            node scripts/run-ash-constitutional-convergence-handshake.mjs
      - name: Run tiered cross-browser field
        shell: bash
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            if [[ "$browser" == "chromium" ]]; then
              TD613_BROWSER="$browser" TD613_BASE_URL=http://127.0.0.1:6130 TD613_ARTIFACT_DIR="artifacts/ash-a2-a5-$browser" \
                timeout --foreground --signal=INT --kill-after=15s 540s node scripts/ash-a2-a5-browser-probe.mjs
              TD613_BROWSER="$browser" TD613_BASE_URL=http://127.0.0.1:6130 TD613_ASH_STAGES=A7,A8,A9,A10,A11 TD613_ARTIFACT_DIR="artifacts/ash-a7-a11-$browser" \
                timeout --foreground --signal=INT --kill-after=15s 480s node scripts/ash-a7-a11-browser-probe.mjs
            fi
            TD613_BROWSER="$browser" TD613_BASE_URL=http://127.0.0.1:6130 TD613_ARTIFACT_DIR="artifacts/ash-a12-$browser" \
              timeout --foreground --signal=INT --kill-after=15s 420s node scripts/ash-a12-browser-probe.mjs
            TD613_BROWSER="$browser" TD613_BASE_URL=http://127.0.0.1:6130 TD613_ARTIFACT_DIR="artifacts/ash-flowcore-$browser" \
              timeout --foreground --signal=INT --kill-after=15s 480s node scripts/run-ash-flowcore-live-field-browser-probe.mjs
            TD613_BROWSER="$browser" TD613_BASE_URL=http://127.0.0.1:6130 TD613_ARTIFACT_DIR="artifacts/ash-ingress-$browser" \
              timeout --foreground --signal=INT --kill-after=15s 360s node scripts/ash-ingress-polish-browser-probe.mjs
            TD613_BROWSER="$browser" TD613_BASE_URL=http://127.0.0.1:6130 TD613_ARTIFACT_DIR="artifacts/ash-reviewability-$browser" \
              timeout --foreground --signal=INT --kill-after=15s 420s node scripts/ash-reviewability-browser-probe.mjs
            TD613_BROWSER="$browser" TD613_BASE_URL=http://127.0.0.1:6130 TD613_ARTIFACT_DIR="artifacts/ash-research-$browser" \
              timeout --foreground --signal=INT --kill-after=15s 480s node scripts/ash-research-ux-browser-probe.mjs
          done
      - name: Stop bounded Ash runtime
        if: always()
        run: test -f artifacts/ash-server.pid && kill "$(cat artifacts/ash-server.pid)" || true
      - name: Preserve consolidated Ash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ash-consolidated-ci-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  phase4:
    name: Phase IV local integration
    needs: scope
    if: needs.scope.outputs.phase4 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pytest sympy
      - name: Validate Phase IV contracts
        run: |
          python -m py_compile api/dome-world-engine-guard.py packages/dome_world_exact/reciprocal_bridge.py packages/dome_world_exact/flowcore_context.py scripts/phase4-local-integration-server.py
          python -m pytest packages/dome_world_exact/tests/test_reciprocal_bridge_v01.py -q
          python -m pytest packages/dome_world_exact/tests/test_flowcore_context.py packages/dome_world_exact/tests/test_flowcore_context_api.py -q
          node tests/aperture-phase4-bridge.test.mjs
          node tests/phase4-deployment-probe.test.mjs
          node tests/phase4-release-sync.test.mjs
          node tests/release-manifest.test.mjs
          node tests/docs-surface.test.mjs
          node tests/release-hardening.test.mjs
          node tests/release-plumbing.test.mjs
          node tests/amari-patch-lane.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium
      - name: Run bounded Phase IV runtime
        run: |
          mkdir -p artifacts/phase4
          python scripts/phase4-local-integration-server.py --port 6134 > artifacts/phase4/server.log 2>&1 &
          echo $! > artifacts/phase4/server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:6134/api/aperture-bridge > artifacts/phase4/readiness.json; then
              break
            fi
            sleep 1
          done
          TD613_BASE_URL=http://127.0.0.1:6134 TD613_FETCH_TIMEOUT_MS=12000 \
            node scripts/phase4-reciprocal-bridge-deployment-probe.mjs > artifacts/phase4/live-probe.json
          TD613_BASE_URL=http://127.0.0.1:6134 TD613_ARTIFACT_DIR=artifacts/phase4/browser \
            node scripts/phase4-reciprocal-bridge-browser-probe.mjs
      - name: Stop Phase IV runtime
        if: always()
        run: test -f artifacts/phase4/server.pid && kill "$(cat artifacts/phase4/server.pid)" || true
      - name: Preserve Phase IV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-consolidated-ci-evidence
          path: artifacts/phase4/
          if-no-files-found: warn
          retention-days: 7
