name: TD613 Consolidated Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation mode'
        required: true
        default: standard
        type: choice
        options:
          - standard
          - full-browser
          - full-repository
          - calibration

permissions:
  contents: read

concurrency:
  group: td613-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  PLAYWRIGHT_VERSION: '1.53.2'

jobs:
  scope:
    name: Classify exact-head browser witness scope
    runs-on: ubuntu-latest
    outputs:
      validation_scope: ${{ steps.classify.outputs.validation_scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select Giving-only or full-product witness
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            git diff --name-only -z "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              | node scripts/classify-validation-scope.mjs --github-output "$GITHUB_OUTPUT"
          else
            echo 'validation_scope=full' >> "$GITHUB_OUTPUT"
          fi

  contracts:
    name: Static, constitutional, and release contracts
    needs: scope
    if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'calibration' && inputs.mode != 'full-repository')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install repository dependencies once
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pytest sympy
      - name: Enforce the four-workflow estate and release membrane
        run: |
          node tests/workflow-estate.test.mjs
          node tests/tcp-smoke.test.mjs
          node tests/release-manifest.test.mjs
          node tests/docs-surface.test.mjs
          node tests/release-hardening.test.mjs
          node tests/vercel-deploy-hygiene.test.mjs
          node tests/vercel-operator-release-gate.test.mjs
          node tests/vercel-relock-safety.test.mjs
          node tests/release-plumbing.test.mjs
          node tests/product-architecture/shell.test.mjs
          node tests/giving-validation-scope.test.mjs
      - name: Validate Giving and Campaign Deputy import contracts
        run: |
          node tests/giving-history-package.test.mjs
          node tests/giving-campaign-deputy-import.test.mjs
          node tests/giving-production-readiness.test.mjs
          node tests/giving-dispatcher.test.mjs
          node tests/giving-client-api.test.mjs
          node tests/giving-client-model.test.mjs
          node tests/giving-client-vault.test.mjs
          node tests/giving-client-surface.test.mjs
      - name: Validate Dome-World static surfaces
        if: needs.scope.outputs.validation_scope != 'giving'
        run: |
          npm run test:dome-world:art
          npm run test:dome-world:phase3
      - name: Validate Phase IV static surfaces
        if: needs.scope.outputs.validation_scope != 'giving'
        run: |
          python -m py_compile api/dome-world-engine-guard.py packages/dome_world_exact/reciprocal_bridge.py packages/dome_world_exact/flowcore_context.py scripts/phase4-local-integration-server.py
          python -m pytest packages/dome_world_exact/tests/test_reciprocal_bridge_v01.py packages/dome_world_exact/tests/test_flowcore_context.py packages/dome_world_exact/tests/test_flowcore_context_api.py -q
          node tests/aperture-phase4-bridge.test.mjs
          node tests/phase4-deployment-probe.test.mjs
          node tests/phase4-release-sync.test.mjs
      - name: Validate Ash core and ingress surfaces
        if: needs.scope.outputs.validation_scope != 'giving'
        run: |
          node tests/ash-keep-core.test.mjs
          node tests/ash-keep-continuity.test.mjs
          node tests/ash-keep-hush-api.test.mjs
          node tests/ash-live-ingress-demos-cache.test.mjs
          node tests/ash-ingress-polish.test.mjs
          node tests/ash-reviewability.test.mjs
      - name: Validate Ash A2-A8 surfaces
        if: needs.scope.outputs.validation_scope != 'giving'
        run: |
          node tests/ash-a2-a5-whole-instrument.test.mjs
          node tests/ash-a7-home-recompilation.test.mjs
          node tests/ash-a8-case-map-recompilation.test.mjs
          node tests/ash-flowcore-live-field.test.mjs
      - name: Validate Ash A9 Work
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node tests/ash-a9-work-recompilation.test.mjs
      - name: Validate Ash A10 Choir
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node tests/ash-a10-choir-recompilation.test.mjs
      - name: Validate Ash A11 Capsule and postclosure cache law
        if: needs.scope.outputs.validation_scope != 'giving'
        run: |
          node tests/ash-a11-capsule-recompilation.test.mjs
          node tests/ash-a11-postclosure-cache-eviction.test.mjs
      - name: Validate Ash A12 command rationalization
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node tests/ash-a12-command-rationalization.test.mjs
      - name: Validate Ash A13 unified registry and workflow collapse
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node tests/ash-a13-unified-demo-registry.test.mjs
      - name: Validate Ash A14 Archive accession
        if: needs.scope.outputs.validation_scope != 'giving'
        run: |
          node --check app/dome-world/ash-archive-profile-demo.js
          node --check scripts/ash-a14-archive-browser-probe.mjs
          node tests/ash-a14-archive-accession.test.mjs
      - name: Validate Ash A15 empirical profile journeys
        if: needs.scope.outputs.validation_scope != 'giving'
        run: |
          node --check app/dome-world/ash-a15-empirical-profile-journeys.js
          node --check scripts/ash-a15-empirical-profile-journeys-browser-probe.mjs
          node tests/ash-a15-empirical-profile-journeys.test.mjs
      - name: Validate Ash demo hydration surfaces
        if: needs.scope.outputs.validation_scope != 'giving'
        run: |
          node tests/ash-research-ux-rehydration.test.mjs
          node tests/ash-final-rehydration-boundaries.test.mjs
          node tests/ash-profile-demos.test.mjs
          node tests/ash-four-profile-pedagogy.test.mjs
          node tests/ash-legal-ux.test.mjs
          node tests/ash-legal-control-state.test.mjs
      - name: Validate Ash production-closure surfaces
        if: needs.scope.outputs.validation_scope != 'giving'
        run: |
          node tests/ash-keep-production-closure-contract.test.mjs
          node tests/ash-lifecycle-production-contract.test.mjs
      - name: Validate Flow-Core P0-P7 seam closure
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node tests/flowcore-p0-p7-seam-closure.test.mjs
      - name: Validate Flow-Core P0-P10 completion
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node tests/flowcore-p0-p10-completion.test.mjs
      - name: Flow-Core claim · exact-head matrix placement
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node --test --test-name-pattern="cross-browser evidence lives" tests/flowcore-production-observation.test.mjs
      - name: Flow-Core claim · bounded production confirmation
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node --test --test-name-pattern="production release verifies source" tests/flowcore-production-observation.test.mjs
      - name: Flow-Core claim · empirical authority separation
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node --test --test-name-pattern="production probes preserve" tests/flowcore-production-observation.test.mjs
      - name: Flow-Core claim · executable dependency closure
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node --test --test-name-pattern="exact-source observation follows" tests/flowcore-production-observation.test.mjs
      - name: Flow-Core claim · static rewrite parity
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node --test --test-name-pattern="exact static Vercel rewrites" tests/flowcore-production-observation.test.mjs
      - name: Flow-Core claim · concurrent station packages
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node --test --test-name-pattern="independent station packages" tests/flowcore-production-observation.test.mjs
      - name: Validate Flow-Core runtime browser contract
        if: needs.scope.outputs.validation_scope != 'giving'
        run: node tests/flowcore-runtime-browser-probe.test.mjs
      - name: Preserve diagnostics only when held
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: td613-consolidated-contract-diagnostics
          path: |
            artifacts/
            *.log
          if-no-files-found: ignore
          retention-days: 3

  ash_browser_shard:
    name: Front-line exact-head browser shard · ${{ matrix.browser }}
    needs: scope
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'full-browser') ||
      (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && needs.scope.outputs.validation_scope != 'giving')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install one browser engine for this shard
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pytest sympy
          npm install --no-save --package-lock=false playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Start isolated core extended and Flow-Core runtimes
        shell: bash
        run: |
          set -euo pipefail
          browser='${{ matrix.browser }}'
          for spec in core:6130 extended:6131 flowcore:6132; do
            lane="${spec%%:*}"
            port="${spec##*:}"
            mkdir -p "artifacts/$browser/$lane"
            node scripts/ash-keep-local-closure-server.mjs "$port" > "artifacts/$browser/$lane/server.log" 2>&1 &
            echo $! > "artifacts/$browser/$lane/server.pid"
          done
          for spec in core:6130 extended:6131 flowcore:6132; do
            lane="${spec%%:*}"
            port="${spec##*:}"
            ready=0
            for attempt in $(seq 1 40); do
              if curl -fsS --max-time 2 "http://127.0.0.1:$port/__ash_keep_closure/readiness" > "artifacts/$browser/$lane/readiness.json"; then
                ready=1
                break
              fi
              sleep 1
            done
            if [[ "$ready" -ne 1 ]]; then
              cat "artifacts/$browser/$lane/server.log"
              exit 1
            fi
          done
      - name: Run front-line A8 A12 and lifecycle preflight for this engine
        shell: bash
        run: |
          set +e
          browser='${{ matrix.browser }}'
          export TD613_BROWSER="$browser"
          export TD613_BASE_URL='http://127.0.0.1:6130'
          mkdir -p "artifacts/$browser/preflight"
          : > "artifacts/$browser/preflight/failures.tsv"
          failures=0

          TD613_ASH_STAGES='A8' TD613_ARTIFACT_DIR="artifacts/$browser/preflight/a8" timeout --foreground --signal=INT --kill-after=15s 420s node scripts/ash-a7-a11-browser-probe.mjs
          status=$?
          if [[ "$status" -ne 0 ]]; then printf 'A8\t%s\n' "$status" >> "artifacts/$browser/preflight/failures.tsv"; failures=1; fi

          TD613_A12_ENTRY_PREFLIGHT='true' TD613_ARTIFACT_DIR="artifacts/$browser/preflight/a12-entry" timeout --foreground --signal=INT --kill-after=15s 240s node scripts/ash-a12-browser-probe.mjs
          status=$?
          if [[ "$status" -ne 0 ]]; then printf 'A12_ENTRY\t%s\n' "$status" >> "artifacts/$browser/preflight/failures.tsv"; failures=1; fi

          TD613_ARTIFACT_DIR="artifacts/$browser/preflight/lifecycle" timeout --foreground --signal=INT --kill-after=15s 420s node scripts/run-ash-keep-a1-production-probe.mjs
          status=$?
          if [[ "$status" -ne 0 ]]; then printf 'LIFECYCLE\t%s\n' "$status" >> "artifacts/$browser/preflight/failures.tsv"; failures=1; fi

          BROWSER="$browser" node <<'NODE'
          const fs = require('node:fs');
          const browser = process.env.BROWSER;
          const path = `artifacts/${browser}/preflight/failures.tsv`;
          const failures = fs.readFileSync(path, 'utf8').trim().split('\n').filter(Boolean).map(line => {
            const [seam, status] = line.split('\t');
            return { seam, status:Number(status) };
          });
          fs.writeFileSync(`artifacts/${browser}/preflight/manifest.json`, JSON.stringify({
            schema:'td613.ash.front-line-preflight/v0.3-per-engine',
            browser,
            scope:['A8','A12_ENTRY','LIFECYCLE'],
            fail_fast:false,
            per_engine_observed:true,
            failures,
            ok:failures.length === 0,
            authority_changed:false,
            source_bytes_moved:false,
            human_closure_required:true
          }, null, 2));
          NODE

          if [[ "$failures" -ne 0 ]]; then
            cat "artifacts/$browser/preflight/failures.tsv"
            exit 1
          fi
      - name: Run core extended and Flow-Core lanes in parallel
        shell: bash
        run: |
          set +e
          browser='${{ matrix.browser }}'

          run_core() (
            set -euo pipefail
            export TD613_BROWSER="$browser"
            export TD613_BASE_URL='http://127.0.0.1:6130'
            TD613_ARTIFACT_DIR="artifacts/$browser/core/a2-a5" timeout --foreground --signal=INT --kill-after=15s 540s node scripts/ash-a2-a5-browser-probe.mjs
            TD613_ASH_STAGES='A7,A8,A9,A10,A11' TD613_ARTIFACT_DIR="artifacts/$browser/core/a7-a11" timeout --foreground --signal=INT --kill-after=15s 540s node scripts/ash-a7-a11-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/$browser/core/a12" timeout --foreground --signal=INT --kill-after=15s 420s node scripts/ash-a12-browser-probe.mjs
          )

          run_extended() (
            set -euo pipefail
            export TD613_BROWSER="$browser"
            export TD613_BASE_URL='http://127.0.0.1:6131'
            TD613_ARTIFACT_DIR="artifacts/$browser/extended/a13" timeout --foreground --signal=INT --kill-after=15s 480s node scripts/ash-a13-demo-registry-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/$browser/extended/a14" timeout --foreground --signal=INT --kill-after=15s 480s node scripts/ash-a14-archive-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/$browser/extended/a15" timeout --foreground --signal=INT --kill-after=15s 900s node scripts/ash-a15-empirical-profile-journeys-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/$browser/extended/ingress" timeout --foreground --signal=INT --kill-after=15s 360s node scripts/ash-ingress-polish-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/$browser/extended/reviewability" timeout --foreground --signal=INT --kill-after=15s 420s node scripts/ash-reviewability-browser-probe.mjs
            TD613_ARTIFACT_DIR="artifacts/$browser/extended/research" timeout --foreground --signal=INT --kill-after=15s 480s node scripts/ash-research-ux-browser-probe.mjs
          )

          run_flowcore() (
            set -euo pipefail
            export TD613_BROWSER="$browser"
            export TD613_BASE_URL='http://127.0.0.1:6132'
            TD613_ARTIFACT_DIR="artifacts/$browser/flowcore/live-field" timeout --foreground --signal=INT --kill-after=15s 480s node scripts/run-ash-flowcore-live-field-browser-probe.mjs
            TD613_FLOWCORE_ROUTE_PREFIX='app/dome-world' TD613_BROWSERS="$browser" TD613_ARTIFACT_DIR="artifacts/$browser/flowcore/runtime" TD613_PRODUCTION_OBSERVATION='false' timeout --foreground --signal=INT --kill-after=20s 1500s node scripts/flowcore-runtime-browser-probe.mjs
          )

          run_core > "artifacts/$browser/core/lane.log" 2>&1 & core_pid=$!
          run_extended > "artifacts/$browser/extended/lane.log" 2>&1 & extended_pid=$!
          run_flowcore > "artifacts/$browser/flowcore/lane.log" 2>&1 & flowcore_pid=$!

          wait "$core_pid"; core_status=$?
          wait "$extended_pid"; extended_status=$?
          wait "$flowcore_pid"; flowcore_status=$?

          printf 'core\t%s\nextended\t%s\nflowcore\t%s\n' "$core_status" "$extended_status" "$flowcore_status" > "artifacts/$browser/lane-status.tsv"
          BROWSER="$browser" CORE_STATUS="$core_status" EXTENDED_STATUS="$extended_status" FLOWCORE_STATUS="$flowcore_status" node <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            schema:'td613.exact-head.browser-shard/v0.1',
            browser:process.env.BROWSER,
            lanes:{
              core:Number(process.env.CORE_STATUS),
              extended:Number(process.env.EXTENDED_STATUS),
              flowcore:Number(process.env.FLOWCORE_STATUS)
            },
            fail_fast:false,
            lane_parallelism:true,
            authority_changed:false,
            source_bytes_moved:false,
            human_closure_required:true
          };
          receipt.ok = Object.values(receipt.lanes).every(status => status === 0);
          fs.writeFileSync(`artifacts/${process.env.BROWSER}/shard-receipt.json`, JSON.stringify(receipt, null, 2));
          NODE

          if [[ "$core_status" -ne 0 || "$extended_status" -ne 0 || "$flowcore_status" -ne 0 ]]; then
            for lane in core extended flowcore; do
              echo "===== $browser / $lane ====="
              tail -n 120 "artifacts/$browser/$lane/lane.log" || true
            done
            exit 1
          fi
      - name: Stop isolated runtimes
        if: always()
        shell: bash
        run: |
          browser='${{ matrix.browser }}'
          for lane in core extended flowcore; do
            pid_file="artifacts/$browser/$lane/server.pid"
            test ! -f "$pid_file" || kill "$(cat "$pid_file")" 2>/dev/null || true
          done
      - name: Preserve this engine evidence shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-browser-shard-${{ matrix.browser }}
          path: artifacts/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 7

  ash_browser:
    name: Full-product exact-head Chromium Firefox WebKit witness
    needs: [contracts, scope, ash_browser_shard]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode == 'full-browser') ||
      (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && needs.scope.outputs.validation_scope != 'giving'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install convergence dependencies and Chromium only
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pytest sympy
          npm install --no-save --package-lock=false playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium
      - name: Collect surviving browser evidence shards
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: td613-browser-shard-*
          path: artifacts/browser-shards
          merge-multiple: false
      - name: Run bounded closure and constitutional convergence once
        run: |
          mkdir -p artifacts/convergence
          node scripts/ash-keep-local-closure-server.mjs 6130 > artifacts/convergence/ash-server.log 2>&1 &
          echo $! > artifacts/convergence/ash-server.pid
          for attempt in $(seq 1 40); do
            curl -fsS --max-time 2 http://127.0.0.1:6130/__ash_keep_closure/readiness > artifacts/convergence/ash-readiness.json && break
            sleep 1
          done
          TD613_BASE_URL=http://127.0.0.1:6130 TD613_ARTIFACT_DIR=artifacts/convergence/ash-closure timeout --foreground --signal=INT --kill-after=15s 420s node scripts/run-ash-keep-a1-production-probe.mjs
          TD613_BASE_URL=http://127.0.0.1:6130 TD613_ARTIFACT_DIR=artifacts/convergence/ash-handshake timeout --foreground --signal=INT --kill-after=15s 360s node scripts/run-ash-constitutional-convergence-handshake.mjs
      - name: Stop convergence Ash runtime
        if: always()
        run: test ! -f artifacts/convergence/ash-server.pid || kill "$(cat artifacts/convergence/ash-server.pid)" 2>/dev/null || true
      - name: Run Phase IV live and browser probe with Chromium
        run: |
          python scripts/phase4-local-integration-server.py --port 6134 > artifacts/convergence/phase4-server.log 2>&1 &
          echo $! > artifacts/convergence/phase4-server.pid
          for attempt in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:6134/api/aperture-bridge > artifacts/convergence/phase4-readiness.json && break
            sleep 1
          done
          TD613_BASE_URL=http://127.0.0.1:6134 TD613_FETCH_TIMEOUT_MS=12000 node scripts/phase4-reciprocal-bridge-deployment-probe.mjs > artifacts/convergence/phase4-live-probe.json
          TD613_BASE_URL=http://127.0.0.1:6134 TD613_ARTIFACT_DIR=artifacts/convergence/phase4-browser node scripts/phase4-reciprocal-bridge-browser-probe.mjs
      - name: Stop Phase IV runtime
        if: always()
        run: test ! -f artifacts/convergence/phase4-server.pid || kill "$(cat artifacts/convergence/phase4-server.pid)" 2>/dev/null || true
      - name: Preserve convergence evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-exact-head-browser-convergence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce front-line shard convergence
        if: always()
        env:
          CONTRACT_RESULT: ${{ needs.contracts.result }}
          SHARD_RESULT: ${{ needs.ash_browser_shard.result }}
        run: |
          printf 'contracts=%s\nshards=%s\n' "$CONTRACT_RESULT" "$SHARD_RESULT"
          [[ "$CONTRACT_RESULT" == 'success' && "$SHARD_RESULT" == 'success' ]]

  giving_browser:
    name: Giving-only exact-head Chromium Firefox WebKit witness
    needs: [contracts, scope]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'ready_for_review' &&
      needs.scope.outputs.validation_scope == 'giving'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Giving dependencies and all browser engines once
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium firefox webkit
      - name: Start bounded offline Giving runtime
        run: |
          mkdir -p artifacts
          node tests/giving-client-preview-server.mjs 6136 > artifacts/giving-server.log 2>&1 &
          echo $! > artifacts/giving-server.pid
          for attempt in $(seq 1 40); do
            curl -fsS --max-time 2 'http://127.0.0.1:6136/giving/history/?surface=operator' >/dev/null && exit 0
            sleep 1
          done
          cat artifacts/giving-server.log
          exit 1
      - name: Witness Campaign Deputy exports through every engine
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            export TD613_BROWSER="$browser"
            export TD613_BASE_URL='http://127.0.0.1:6136'
            TD613_ARTIFACT_DIR="artifacts/giving-$browser" timeout --foreground --signal=INT --kill-after=15s 300s node scripts/giving-browser-probe.mjs
          done
      - name: Stop Giving runtime
        if: always()
        run: test ! -f artifacts/giving-server.pid || kill "$(cat artifacts/giving-server.pid)" 2>/dev/null || true
      - name: Preserve Giving-only exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-giving-exact-head-browser-receipts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  full_repository:
    name: Explicit full-repository validation
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full-repository'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run the complete repository suite only by explicit dispatch
        run: npm test

  calibration:
    name: Explicit self-hosted calibration
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'calibration'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run calibration only by explicit dispatch
        run: npm run test:calibration 2>&1 | tee calibration-output.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-output
          path: calibration-output.txt
          retention-days: 7
