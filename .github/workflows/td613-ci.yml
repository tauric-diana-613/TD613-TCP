name: TD613 Consolidated CI

on:
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: td613-ci-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: One contract estate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository dependencies once
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pytest sympy
      - name: Validate consolidated runners
        run: |
          node --check scripts/run-td613-consolidated-contracts.mjs
          node --check scripts/run-td613-full-browser-closure.mjs
      - name: Run the consolidated contract estate
        env:
          TD613_ARTIFACT_DIR: artifacts/td613-consolidated-ci
        run: node scripts/run-td613-consolidated-contracts.mjs
      - name: Run retained audit calibration
        run: npm run test:calibration 2>&1 | tee artifacts/td613-consolidated-ci/calibration.log
      - name: Preserve one contract receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-consolidated-contract-evidence
          path: artifacts/td613-consolidated-ci/
          if-no-files-found: warn
          retention-days: 14

  authorize-full-browser-closure:
    name: Authorize exact-head browser closure
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/td613-full-browser-closure ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected_sha: ${{ steps.authorize.outputs.selected_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate exact PR-head command
        id: authorize
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          read -r COMMAND SELECTED_SHA EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-full-browser-closure' ]] || { echo 'Unexpected browser-closure command.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" ]] || { echo 'Browser-closure command must contain exactly command and SHA.' >&2; exit 1; }
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Browser-closure command omitted a 40-character SHA.' >&2; exit 1; }
          git fetch origin "pull/${PR_NUMBER}/head:refs/remotes/origin/td613-browser-closure-head"
          PR_HEAD="$(git rev-parse refs/remotes/origin/td613-browser-closure-head)"
          [[ "$SELECTED_SHA" == "$PR_HEAD" ]] || { echo "Selected SHA $SELECTED_SHA is not current PR head $PR_HEAD." >&2; exit 1; }
          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"

  full-browser-closure:
    name: One full browser closure
    needs: authorize-full-browser-closure
    if: needs.authorize-full-browser-closure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize-full-browser-closure.outputs.selected_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install repository and browser dependencies once
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Run one bounded Chromium, Firefox, and WebKit closure
        env:
          TD613_BROWSERS: chromium,firefox,webkit
          TD613_ARTIFACT_DIR: artifacts/td613-full-browser-closure
        run: node scripts/run-td613-full-browser-closure.mjs
      - name: Preserve one browser receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-full-browser-closure-evidence
          path: artifacts/td613-full-browser-closure/
          if-no-files-found: warn
          retention-days: 30
