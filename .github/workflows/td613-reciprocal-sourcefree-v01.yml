name: TD613 Stage III-B source-free reciprocal receiver
on:
  pull_request:
    branches: ['main']
    paths:
      - 'scripts/reciprocal-receiver-sourcefree-v01.mjs'
      - 'tests/reciprocal-receiver-sourcefree-v01.test.mjs'
      - 'docs/research/reciprocal-transfer/**'
      - '.github/workflows/td613-reciprocal-sourcefree-v01.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact source-free reciprocal tests
        run: node --test tests/reciprocal-receiver-sourcefree-v01.test.mjs
      - name: Syntax and whitespace
        run: |
          node --check scripts/reciprocal-receiver-sourcefree-v01.mjs
          node --check tests/reciprocal-receiver-sourcefree-v01.test.mjs
          git diff --check HEAD^ HEAD
