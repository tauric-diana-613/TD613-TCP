name: TD613 SRC-first reference regeneration
on:
  push:
    branches:
      - research/src-first-recovered-qualification-20261104
    paths:
      - 'scripts/encyclopedia-reference-runtime.js'
      - 'scripts/atelier-universal-encyclopedia-receiver-v1.py'
      - 'scripts/atelier-src-method-adapter-v1.py'
      - 'tests/test_atelier_universal_encyclopedia_receiver_v1.py'
      - 'tests/test_atelier_src_method_adapter_v1.py'
      - 'scripts/build-encyclopedia-reference.mjs'
      - 'tests/encyclopedia-lexical-boundaries.test.mjs'
      - '.github/workflows/td613-src-first-reference-regeneration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: td613-src-first-reference-regeneration
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: research/src-first-recovered-qualification-20261104
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate original 1141-record Encyclopedia mirror
        run: |
          node scripts/build-encyclopedia-reference.mjs
          node scripts/build-encyclopedia-reference.mjs --check
      - name: Verify original canonical SHA and record count
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('app/encyclopedia/reference/manifest.json','utf8'));
          if(m.record_count!==1141||m.canonical_payload_sha256!=='ff0c98f564c9157f22b8603a20ddefa3ca13d843b17bdfb7e2a495408a49b4c9')throw Error('Canonical reference payload changed');
          console.log(JSON.stringify({record_count:m.record_count,canonical_payload_sha256:m.canonical_payload_sha256,artifact_html_sha256:m.artifact_html_sha256}));
          NODE
      - name: Install declared test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run lexical and canonical reference regression
        run: |
          node --test tests/encyclopedia-lexical-boundaries.test.mjs tests/encyclopedia-reference.test.mjs tests/encyclopedia-navigation.test.mjs tests/encyclopedia-intake.test.mjs
      - name: Verify source-free receiver and original SRC tomography differential
        run: |
          python -B -m unittest discover -s tests -p 'test_atelier_universal_encyclopedia_receiver_v1.py' -v
          python -B -m unittest discover -s tests -p 'test_atelier_src_method_adapter_v1.py' -v
      - name: Commit generated mirror only to isolated repair branch
        shell: bash
        run: |
          git diff --check
          git config user.name "td613-qualification-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/encyclopedia/index.html app/encyclopedia/reference/manifest.json app/encyclopedia/llms.txt
          if ! git diff --cached --quiet; then
            git commit -m "build(encyclopedia): regenerate lexical boundary mirror and verified SHA"
            git push origin HEAD:refs/heads/research/src-first-recovered-qualification-20261104
          else
            echo "Generated mirror already current."
          fi
