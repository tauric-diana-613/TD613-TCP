name: TD613 SRC-first source-free regression (read-only)
on:
  push:
    branches:
      - research/src-first-recovered-qualification-20261104
    paths:
      - 'scripts/atelier-universal-encyclopedia-receiver-v1.py'
      - 'scripts/atelier-src-method-adapter-v1.py'
      - 'scripts/encyclopedia-reference-runtime.js'
      - 'scripts/build-encyclopedia-reference.mjs'
      - 'tests/test_atelier_universal_encyclopedia_receiver_v1.py'
      - 'tests/test_atelier_src_method_adapter_v1.py'
      - 'tests/encyclopedia-lexical-boundaries.test.mjs'
      - '.github/workflows/td613-src-first-source-free-regression.yml'
  pull_request:
    paths:
      - 'scripts/atelier-universal-encyclopedia-receiver-v1.py'
      - 'scripts/atelier-src-method-adapter-v1.py'
      - 'scripts/encyclopedia-reference-runtime.js'
      - 'scripts/build-encyclopedia-reference.mjs'
      - 'tests/test_atelier_universal_encyclopedia_receiver_v1.py'
      - 'tests/test_atelier_src_method_adapter_v1.py'
      - 'tests/encyclopedia-lexical-boundaries.test.mjs'
      - '.github/workflows/td613-src-first-source-free-regression.yml'
permissions:
  contents: read
jobs:
  source-free-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned reference mirror
        run: |
          node scripts/build-encyclopedia-reference.mjs --check
          node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('app/encyclopedia/reference/manifest.json','utf8'));
          if (m.record_count!==1141 || m.canonical_payload_sha256!=='ff0c98f564c9157f22b8603a20ddefa3ca13d843b17bdfb7e2a495408a49b4c9') {
            throw Error('Canonical reference records changed');
          }
          NODE
      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund
      - name: Node reference and lexical regressions
        run: node --test tests/encyclopedia-lexical-boundaries.test.mjs tests/encyclopedia-reference.test.mjs tests/encyclopedia-navigation.test.mjs tests/encyclopedia-intake.test.mjs
      - name: Synthetic receiver tests, including exponent overflow
        run: python -B -m unittest discover -s tests -p 'test_atelier_universal_encyclopedia_receiver_v1.py' -v
      - name: Native SRC tomography adapter differential, including exponent overflow
        run: python -B -m unittest discover -s tests -p 'test_atelier_src_method_adapter_v1.py' -v
      - name: No file mutation
        run: git diff --exit-code
