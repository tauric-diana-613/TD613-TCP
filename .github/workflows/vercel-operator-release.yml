name: Vercel Operator Release

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: td613-vercel-production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.issue.number == 405 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/td613-vercel-release ')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_GATE_ISSUE: '405'
      VERCEL_PROJECT: td-613-tcp
      VERCEL_SCOPE: tauric-diana-s-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TD613_CANONICAL_PRODUCTION_URL: https://td613.com
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate operator authorization and exact commit
        id: authorize
        shell: bash
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r COMMAND TARGET SELECTED_SHA EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-vercel-release' ]] || { echo 'Unexpected release command.' >&2; exit 1; }
          [[ "$TARGET" == 'PRODUCTION' ]] || { echo 'Only the explicitly named PRODUCTION target is accepted.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" ]] || { echo 'Release command must contain exactly command, target, and SHA.' >&2; exit 1; }
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Release command omitted a valid 40-character commit SHA.' >&2; exit 1; }
          CURRENT_MAIN="$(git rev-parse HEAD)"
          [[ "$SELECTED_SHA" == "$CURRENT_MAIN" ]] || { echo "Authorized SHA $SELECTED_SHA is not current main $CURRENT_MAIN." >&2; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('Git-triggered Vercel deployment lock is not active.');
          NODE
          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Classify the authorized release witness scope
        id: scope
        shell: bash
        env:
          SELECTED_SHA: ${{ steps.authorize.outputs.selected_sha }}
        run: |
          set -euo pipefail
          git diff --name-only -z "${SELECTED_SHA}^1" "$SELECTED_SHA" \
            | node scripts/classify-validation-scope.mjs --github-output "$GITHUB_OUTPUT"

      - name: Record accepted release gesture
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Operator release gesture accepted.

          \`\`\`text
          target = PRODUCTION
          selected_commit = ${{ steps.authorize.outputs.selected_sha }}
          deployment_ceiling = 1
          validation_scope = ${{ steps.scope.outputs.validation_scope }}
          premerge_browser_authority = scope-aligned Chromium + Firefox + WebKit witness
          production_confirmation = scope-aligned Chromium witness
          git_auto_deploy = disabled
          workflow_run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          \`\`\`

          The gate will recheck release law, deploy once, verify exact application bytes, run one bounded production confirmation, and restore the deployment lock. ⟐
          EOF_COMMENT
          )"

      - name: Install repository dependencies once
        run: npm ci

      - name: Verify release-critical contracts only
        run: |
          node tests/workflow-estate.test.mjs
          node tests/tcp-smoke.test.mjs
          node tests/vercel-deploy-hygiene.test.mjs
          node tests/vercel-operator-release-gate.test.mjs
          node tests/vercel-relock-safety.test.mjs
          node tests/release-plumbing.test.mjs
          node tests/product-architecture/shell.test.mjs
          node tests/giving-validation-scope.test.mjs

      - name: Verify Giving-only release contracts
        if: steps.scope.outputs.validation_scope == 'giving'
        run: |
          node tests/giving-history-package.test.mjs
          node tests/giving-campaign-deputy-import.test.mjs
          node tests/giving-production-readiness.test.mjs
          node tests/giving-dispatcher.test.mjs
          node tests/giving-client-surface.test.mjs

      - name: Verify canonical practice fixture release contracts
        if: steps.scope.outputs.validation_scope == 'practice'
        run: |
          node tests/pedagogue-practice-fixture.test.mjs
          node tests/pedagogue-design-gate.test.mjs
          node tests/giving-post640-polish.test.mjs

      - name: Verify full-product release contracts
        if: steps.scope.outputs.validation_scope == 'full'
        run: |
          node tests/ash-a12-command-rationalization.test.mjs
          node tests/ash-a13-unified-demo-registry.test.mjs
          node tests/ash-a14-archive-accession.test.mjs
          node tests/ash-lifecycle-production-contract.test.mjs
          node tests/ash-keep-production-closure-contract.test.mjs

      - name: Choose one bounded Vercel release route
        id: mode
        run: |
          if [[ -n "${VERCEL_TOKEN:-}" ]]; then
            echo 'mode=direct-token' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=git-fallback' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize the Giving exact-source receipt
        if: steps.scope.outputs.validation_scope == 'giving'
        env:
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sourcePacketCommit = String(process.env.TD613_SOURCE_PACKET_COMMIT || '').trim();
          if (!/^[0-9a-f]{40}$/.test(sourcePacketCommit)) throw new Error('Giving release receipt requires the authorized source commit.');
          const receipt = {
            schema: 'td613.giving.release-source/v1',
            source_packet_commit: sourcePacketCommit
          };
          fs.writeFileSync('app/giving/history/release-source.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Link exact repository to the existing Vercel project
        if: steps.mode.outputs.mode == 'direct-token'
        run: npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Pull production environment and build once
        if: steps.mode.outputs.mode == 'direct-token'
        run: |
          npx --yes vercel@latest pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy the completed packet once through the token bridge
        if: steps.mode.outputs.mode == 'direct-token'
        id: direct_deploy
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ steps.authorize.outputs.selected_sha }}
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_REPO_SLUG: TD613-TCP
          VERCEL_GIT_REPO_OWNER: tauric-diana-613
        run: |
          set -euo pipefail
          DEPLOY_LOG="$(mktemp)"
          npx --yes vercel@latest deploy --prebuilt --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee "$DEPLOY_LOG"
          DEPLOY_URL="$(grep -Eo 'https://[^[:space:]]+' "$DEPLOY_LOG" | tail -n 1)"
          [[ -n "$DEPLOY_URL" ]] || { echo 'Vercel returned no deployment URL.' >&2; exit 1; }
          echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Create one bounded Git-fallback release commit
        if: steps.mode.outputs.mode == 'git-fallback'
        id: fallback_release
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'vercel.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('Fallback requires the deployment lock to begin closed.');
          config.git.deploymentEnabled = true;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel.json
          if [[ "${{ steps.scope.outputs.validation_scope }}" == 'giving' ]]; then
            git add app/giving/history/release-source.json
          fi
          git commit -m "release: enable one Vercel deployment for ${{ steps.authorize.outputs.selected_sha }}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$TD613_CANONICAL_PRODUCTION_URL" >> "$GITHUB_OUTPUT"

      - name: Resolve deployed production URL
        id: deployed
        run: |
          if [[ "${{ steps.mode.outputs.mode }}" == 'direct-token' ]]; then
            URL='${{ steps.direct_deploy.outputs.deployment_url }}'
          else
            URL='${{ steps.fallback_release.outputs.deployment_url }}'
          fi
          [[ -n "$URL" ]] || { echo 'Release route produced no production URL.' >&2; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed bytes match the authorized source packet
        env:
          TD613_BASE_URL: ${{ steps.deployed.outputs.url }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_ARTIFACT_DIR: artifacts/exact-source
          TD613_PROBE_ATTEMPTS: ${{ steps.mode.outputs.mode == 'git-fallback' && '72' || '24' }}
          TD613_PROBE_DELAY_MS: '5000'
        run: node scripts/flowcore-release-content-probe.mjs

      - name: Install one production browser engine
        run: |
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium

      - name: Confirm deployed Campaign Deputy Giving History exports on Chromium
        if: steps.scope.outputs.validation_scope == 'giving'
        env:
          TD613_BROWSER: chromium
          TD613_BASE_URL: ${{ steps.deployed.outputs.url }}
          TD613_PRODUCTION_OBSERVATION: 'true'
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_GIVING_PROBE_ATTEMPTS: '72'
          TD613_GIVING_PROBE_DELAY_MS: '5000'
          TD613_GIVING_PROBE_REQUEST_TIMEOUT_MS: '15000'
          TD613_ARTIFACT_DIR: artifacts/giving-production
        run: timeout --foreground --signal=INT --kill-after=15s 600s node scripts/giving-browser-probe.mjs

      - name: Confirm deployed canonical practice fixture on Chromium
        if: steps.scope.outputs.validation_scope == 'practice'
        env:
          TD613_BROWSER: chromium
          TD613_BASE_URL: ${{ steps.deployed.outputs.url }}
          TD613_PRODUCTION_OBSERVATION: 'true'
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_GIVING_PROBE_ATTEMPTS: '72'
          TD613_GIVING_PROBE_DELAY_MS: '5000'
          TD613_GIVING_PROBE_REQUEST_TIMEOUT_MS: '15000'
          TD613_ARTIFACT_DIR: artifacts/practice-production
        run: timeout --foreground --signal=INT --kill-after=15s 600s node scripts/giving-browser-probe.mjs

      - name: Confirm deployed A14 six-demo registry and Archive on Chromium desktop and mobile
        if: steps.scope.outputs.validation_scope == 'full'
        env:
          TD613_BROWSER: chromium
          TD613_BASE_URL: ${{ steps.deployed.outputs.url }}
        run: |
          TD613_ARTIFACT_DIR=artifacts/a14-production-registry timeout --foreground --signal=INT --kill-after=15s 600s node scripts/ash-a13-demo-registry-browser-probe.mjs
          TD613_ARTIFACT_DIR=artifacts/a14-production-archive timeout --foreground --signal=INT --kill-after=15s 600s node scripts/ash-a14-archive-browser-probe.mjs

      - name: Observe deployed Ash lifecycle without promotion
        if: steps.scope.outputs.validation_scope == 'full'
        env:
          TD613_BASE_URL: ${{ steps.deployed.outputs.url }}
          TD613_ARTIFACT_DIR: artifacts/lifecycle-production
        run: timeout --foreground --signal=INT --kill-after=15s 600s node scripts/ash-lifecycle-production-probe.mjs

      - name: Preserve bounded production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-bounded-production-release-evidence
          path: |
            artifacts/exact-source/
            artifacts/a14-production-registry/
            artifacts/a14-production-archive/
            artifacts/lifecycle-production/
            artifacts/giving-production/
            artifacts/practice-production/
          if-no-files-found: warn
          retention-days: 7

      - name: Restore the Git deployment lock after fallback
        if: always() && steps.mode.outputs.mode == 'git-fallback' && steps.fallback_release.outputs.release_sha != ''
        id: relock
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'vercel.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.git = { ...(config.git || {}), deploymentEnabled: false };
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          git add vercel.json
          git commit -m "release: restore Vercel deployment lock for ${{ steps.authorize.outputs.selected_sha }}"
          RELOCK_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "relock_sha=$RELOCK_SHA" >> "$GITHUB_OUTPUT"

      - name: Seal successful production release
        if: success()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Vercel production release completed and bounded observation passed.

          \`\`\`text
          source_packet_commit = ${{ steps.authorize.outputs.selected_sha }}
          release_mode = ${{ steps.mode.outputs.mode }}
          release_commit = ${{ steps.fallback_release.outputs.release_sha || 'not-applicable' }}
          relock_commit = ${{ steps.relock.outputs.relock_sha || 'not-applicable' }}
          target = PRODUCTION
          deployment_count = 1
          deployment_url = ${{ steps.deployed.outputs.url }}
          validation_scope = ${{ steps.scope.outputs.validation_scope }}
          exact_source_content = PASS
          premerge_scope_aligned_chromium_firefox_webkit = REQUIRED_AND_PASSED_BEFORE_MERGE
          production_giving_history = ${{ steps.scope.outputs.validation_scope == 'giving' && 'PASS' || 'NOT_APPLICABLE' }}
          production_practice_fixture = ${{ steps.scope.outputs.validation_scope == 'practice' && 'PASS' || 'NOT_APPLICABLE' }}
          production_a14_registry_archive = ${{ steps.scope.outputs.validation_scope == 'full' && 'PASS' || 'NOT_APPLICABLE' }}
          production_chromium_desktop_mobile = ${{ steps.scope.outputs.validation_scope == 'full' && 'PASS' || 'NOT_APPLICABLE' }}
          ash_lifecycle_deployed_observation = ${{ steps.scope.outputs.validation_scope == 'full' && 'PASS' || 'NOT_APPLICABLE' }}
          counts_as_human_evidence = false
          child_study_authorized = false
          public_route_promotion_authorized = false
          application_tree_drift = none
          git_auto_deploy = disabled
          \`\`\`

          Production confirmation follows the classified change scope, does not repeat the full pre-merge browser matrix, and grants no human-evidence, child-study, release-future, custody, or program-closure authority. Sealed ⟐
          EOF_COMMENT
          )"

      - name: Record held release
        if: failure()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Vercel production release held.

          \`\`\`text
          source_packet_commit = ${{ steps.authorize.outputs.selected_sha || 'unresolved' }}
          release_mode = ${{ steps.mode.outputs.mode || 'unresolved' }}
          release_commit = ${{ steps.fallback_release.outputs.release_sha || 'not-created' }}
          relock_commit = ${{ steps.relock.outputs.relock_sha || 'not-created' }}
          target = PRODUCTION
          validation_scope = ${{ steps.scope.outputs.validation_scope || 'unresolved' }}
          deployment_ceiling = 1
          workflow_run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          \`\`\`

          The fallback lock-restoration step was attempted when applicable. No additional deployment attempt is authorized by this failure. ⟐
          EOF_COMMENT
          )"