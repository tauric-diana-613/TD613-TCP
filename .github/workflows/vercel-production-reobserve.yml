name: Vercel Explicit Production AI Observation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: td613-vercel-production-release
  cancel-in-progress: false

jobs:
  reobserve:
    if: >-
      github.event.issue.number == 405 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.user.login == github.repository_owner || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
      startsWith(github.event.comment.body, '/td613-production-reobserve ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_GATE_ISSUE: '405'
      TD613_CANONICAL_PRODUCTION_URL: https://td613.com
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate observation-only operator authorization
        id: authorize
        shell: bash
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r COMMAND TARGET SELECTED_SHA RELEASE_RUN_ID EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-production-reobserve' ]] || { echo 'Unexpected re-observation command.' >&2; exit 1; }
          [[ "$TARGET" == 'PRODUCTION' ]] || { echo 'Only the explicitly named PRODUCTION target is accepted.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" ]] || { echo 'Re-observation command must contain exactly command, target, source SHA, and prior release run ID.' >&2; exit 1; }
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Re-observation command omitted a valid 40-character source SHA.' >&2; exit 1; }
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Re-observation command omitted a numeric prior release workflow run ID.' >&2; exit 1; }
          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "release_run_id=$RELEASE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Check out the exact deployed source packet
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authorize.outputs.selected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify observation lane has no deployment authority
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('Observation-only witness requires the Git deployment lock to be closed in the selected source packet.');
          NODE

      - name: Admit a prior governed release as observation anchor
        env:
          SELECTED_SHA: ${{ steps.authorize.outputs.selected_sha }}
          RELEASE_RUN_ID: ${{ steps.authorize.outputs.release_run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/reobserve-authority

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > artifacts/reobserve-authority/prior-run.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const selectedSha = String(process.env.SELECTED_SHA || '').trim();
          const releaseRunId = Number(process.env.RELEASE_RUN_ID);
          const run = JSON.parse(fs.readFileSync('artifacts/reobserve-authority/prior-run.json', 'utf8'));

          if (run.id !== releaseRunId) throw new Error(`Prior run identity mismatch: expected ${releaseRunId}, observed ${run.id ?? 'missing'}.`);
          if (run.name !== 'Vercel Operator Release') throw new Error(`Prior run is not the governed Vercel Operator Release: ${run.name || 'missing'}.`);
          if (run.event !== 'issue_comment') throw new Error(`Prior release did not originate from the governed issue-comment conduit: ${run.event || 'missing'}.`);
          if (run.head_branch !== 'main') throw new Error(`Prior release did not execute from main: ${run.head_branch || 'missing'}.`);
          if (!['success', 'failure'].includes(run.conclusion)) throw new Error(`Prior release is not terminal: ${run.conclusion || 'missing'}.`);

          const authority = {
            schema: 'td613.production-ai-observation-authority/v0.2',
            selected_source_packet_commit: selectedSha,
            prior_release_workflow_run: releaseRunId,
            prior_release_conclusion: run.conclusion,
            deployment_authority: false,
            retroactive_release_rewrite: false,
            counts_as_human_evidence: false,
            admitted_at: new Date().toISOString()
          };
          fs.writeFileSync('artifacts/reobserve-authority/authority.json', `${JSON.stringify(authority, null, 2)}\n`);
          NODE

      - name: Record accepted observation-only gesture
        env:
          SELECTED_SHA: ${{ steps.authorize.outputs.selected_sha }}
          RELEASE_RUN_ID: ${{ steps.authorize.outputs.release_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Production witness re-observation gesture accepted.

          \`\`\`text
          target = PRODUCTION
          source_packet_commit = $SELECTED_SHA
          prior_release_workflow_run = $RELEASE_RUN_ID
          deployment_count = 0
          deployment_authority = false
          prior_release_state = PRESERVED_AS_RECORDED
          witness_scope = exact-source parity + Loom/Marrowline live AI canary
          counts_as_human_evidence = false
          workflow_run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          \`\`\`

          This conduit explicitly observes live Gemini routes on an unchanged deployed source. It is independent of deployment success and cannot deploy, relock, or rewrite the earlier release state. ⟐
          EOF_COMMENT
          )"

      - name: Install repository dependencies
        run: npm ci

      - name: Verify exact source receipt before re-observation
        env:
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://td613.com';
          const expected = String(process.env.TD613_SOURCE_PACKET_COMMIT || '').trim();
          const url = new URL('/giving/history/release-source.json', `${base}/`);
          url.searchParams.set('td613_reobserve_pre_guard', `${expected}-${Date.now()}`);
          const response = await fetch(url, { headers: { 'cache-control': 'no-cache' }, redirect: 'follow', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Pre-witness release receipt returned ${response.status}.`);
          const payload = await response.json();
          const observed = String(payload?.source_packet_commit || '').trim();
          if (observed !== expected) throw new Error(`Re-observation source mismatch before witness: expected ${expected}, observed ${observed || 'missing'}.`);
          console.log(`[td613-reobserve-pre-source] source=${observed}`);
          NODE

      - name: Verify deployed bytes before re-observation
        env:
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_ARTIFACT_DIR: artifacts/reobserve-exact-source-before
          TD613_PROBE_ATTEMPTS: '1'
          TD613_PROBE_DELAY_MS: '0'
        run: node scripts/flowcore-release-content-probe.mjs

      - name: Re-observe Loom Demo 1 and independent Marrowline live route
        env:
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_ARTIFACT_DIR: artifacts/loom-production-reobserve
        run: timeout --foreground --signal=INT --kill-after=10s 600s node scripts/loom-production-canary.mjs

      - name: Classify bounded live AI observation
        id: classify_observation
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('artifacts/loom-production-reobserve/receipt.json', 'utf8'));
          const marrowline = receipt?.marrowline_live_route;
          if (
            marrowline?.http_status !== 200
            || marrowline?.ok !== true
            || marrowline?.answer_nonempty !== true
            || marrowline?.human_surface_returned !== true
          ) {
            throw new Error('Marrowline live-route classification lost its human-surface 200 witness.');
          }
          const localAdmission = typeof marrowline?.relay_quality === 'string' ? marrowline.relay_quality : 'UNCLASSIFIED';
          const loomStatus = receipt?.loom_provider_liveness_nonblocking === true
            ? 'PROVIDER_LIVENESS_HELD'
            : (receipt?.http_status === 200 && receipt?.task_status === 'completed' ? 'PASS' : 'UNRESOLVED');
          if (loomStatus === 'UNRESOLVED') throw new Error('Loom observation reached a non-liveness failure state.');
          console.log('marrowline_status=PASS');
          console.log(`marrowline_local_admission=${localAdmission}`);
          console.log(`loom_status=${loomStatus}`);
          NODE

      - name: Confirm exact source receipt after re-observation
        env:
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://td613.com';
          const expected = String(process.env.TD613_SOURCE_PACKET_COMMIT || '').trim();
          const url = new URL('/giving/history/release-source.json', `${base}/`);
          url.searchParams.set('td613_reobserve_post_guard', `${expected}-${Date.now()}`);
          const response = await fetch(url, { headers: { 'cache-control': 'no-cache' }, redirect: 'follow', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Post-witness release receipt returned ${response.status}.`);
          const payload = await response.json();
          const observed = String(payload?.source_packet_commit || '').trim();
          if (observed !== expected) throw new Error(`Production source changed during re-observation: expected ${expected}, observed ${observed || 'missing'}.`);
          console.log(`[td613-reobserve-post-source] source=${observed}`);
          NODE

      - name: Reconfirm deployed bytes after re-observation
        env:
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_ARTIFACT_DIR: artifacts/reobserve-exact-source-after
          TD613_PROBE_ATTEMPTS: '1'
          TD613_PROBE_DELAY_MS: '0'
        run: node scripts/flowcore-release-content-probe.mjs

      - name: Preserve bounded re-observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-production-witness-reobservation-evidence
          path: |
            artifacts/reobserve-authority/
            artifacts/loom-production-reobserve/
            artifacts/reobserve-exact-source-before/
            artifacts/reobserve-exact-source-after/
          if-no-files-found: warn
          retention-days: 7

      - name: Seal successful unchanged-source re-observation
        if: success()
        env:
          SELECTED_SHA: ${{ steps.authorize.outputs.selected_sha }}
          RELEASE_RUN_ID: ${{ steps.authorize.outputs.release_run_id }}
          MARROWLINE_STATUS: ${{ steps.classify_observation.outputs.marrowline_status }}
          MARROWLINE_LOCAL_ADMISSION: ${{ steps.classify_observation.outputs.marrowline_local_admission }}
          LOOM_STATUS: ${{ steps.classify_observation.outputs.loom_status }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Production witness re-observation completed on the unchanged source.

          \`\`\`text
          source_packet_commit = $SELECTED_SHA
          prior_release_workflow_run = $RELEASE_RUN_ID
          prior_release_state = PRESERVED_AS_RECORDED
          deployment_count = 0
          exact_source_pre_guard = PASS
          exact_source_content_before = PASS
          marrowline_live_route = $MARROWLINE_STATUS
          marrowline_local_admission = $MARROWLINE_LOCAL_ADMISSION
          production_loom_demo1_canary = $LOOM_STATUS
          post_witness_source_guard = PASS
          exact_source_content_after = PASS
          counts_as_human_evidence = false
          child_study_authorized = false
          public_route_promotion_authorized = false
          retroactive_release_rewrite = false
          \`\`\`

          A provider-only Loom liveness hold remains nonblocking when exact source and the Marrowline human-surface return are intact. Marrowline local admission stays visible as diagnostic evidence but cannot relabel a nonempty HTTP-200 human return as failure. No Vercel deployment occurred. Sealed ⟐
          EOF_COMMENT
          )"

      - name: Record held re-observation
        if: failure()
        env:
          SELECTED_SHA: ${{ steps.authorize.outputs.selected_sha || 'unresolved' }}
          RELEASE_RUN_ID: ${{ steps.authorize.outputs.release_run_id || 'unresolved' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Production witness re-observation held.

          \`\`\`text
          source_packet_commit = $SELECTED_SHA
          prior_release_workflow_run = $RELEASE_RUN_ID
          prior_release_state = PRESERVED_AS_RECORDED
          deployment_count = 0
          deployment_authority = false
          retroactive_release_rewrite = false
          workflow_run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          \`\`\`

          The observation-only conduit changed no production source and created no deployment authority. Provider liveness failure authorizes neither a deployment nor a historical-state rewrite. ⟐
          EOF_COMMENT
          )"


  marrowline_single_trail:
    name: Marrowline single skeptical-human production trail
    if: >-
      github.event.issue.number == 405 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event.comment.performed_via_github_app == null ||
       github.event.comment.performed_via_github_app.slug == 'chatgpt-codex-connector') &&
      startsWith(github.event.comment.body, '/td613-marrowline-single-trail ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_GATE_ISSUE: '405'
      TD613_CANONICAL_PRODUCTION_URL: https://td613.com
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Authorize one unchanged-source Marrowline trail
        id: authorize_single
        shell: bash
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r COMMAND TARGET SELECTED_SHA RELEASE_RUN_ID EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-marrowline-single-trail' ]] || { echo 'Unexpected Marrowline trail command.' >&2; exit 1; }
          [[ "$TARGET" == 'PRODUCTION' ]] || { echo 'Only the explicitly named PRODUCTION target is accepted.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" ]] || { echo 'Single-trail command must contain exactly command, target, source SHA, and prior release run ID.' >&2; exit 1; }
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Single-trail command requires one 40-character deployed source SHA.' >&2; exit 1; }
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Single-trail command requires one numeric prior release workflow run ID.' >&2; exit 1; }
          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "release_run_id=$RELEASE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Check out current observation harness
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify single trail has no release authority
        env:
          SELECTED_SHA: ${{ steps.authorize_single.outputs.selected_sha }}
          RELEASE_RUN_ID: ${{ steps.authorize_single.outputs.release_run_id }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SELECTED_SHA" HEAD || {
            echo 'Current observation harness no longer descends from the named deployed source packet.' >&2
            exit 1
          }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('Single-trail observation requires the Vercel Git deployment lock to remain closed.');
          NODE
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > /tmp/td613-single-trail-release.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const selectedSha = String(process.env.SELECTED_SHA || '').trim();
          const releaseRunId = Number(process.env.RELEASE_RUN_ID);
          const run = JSON.parse(fs.readFileSync('/tmp/td613-single-trail-release.json', 'utf8'));
          if (run.id !== releaseRunId) throw new Error('Prior release run identity mismatch.');
          if (run.name !== 'Vercel Operator Release') throw new Error('Single trail must bind a governed Vercel Operator Release.');
          if (run.event !== 'issue_comment') throw new Error('Prior release did not originate from the governed issue-comment conduit.');
          if (run.conclusion !== 'success') throw new Error('Single trail requires a successful prior governed release.');
          if (run.head_sha !== selectedSha) throw new Error(`Prior release source mismatch: expected ${selectedSha}, observed ${run.head_sha || 'missing'}.`);
          NODE

      - name: Verify exact production source before single trail
        env:
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize_single.outputs.selected_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected = String(process.env.TD613_SOURCE_PACKET_COMMIT || '').trim();
          const url = new URL('/giving/history/release-source.json', 'https://td613.com/');
          url.searchParams.set('td613_single_trail_pre_guard', `${expected}-${Date.now()}`);
          const response = await fetch(url, { headers: { 'cache-control': 'no-cache' }, redirect: 'follow', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Single-trail pre-guard returned ${response.status}.`);
          const payload = await response.json();
          const observed = String(payload?.source_packet_commit || '').trim();
          if (observed !== expected) throw new Error(`Single-trail source mismatch before witness: expected ${expected}, observed ${observed || 'missing'}.`);
          console.log(`[marrowline-single-trail-pre-source] source=${observed}`);
          NODE

      - name: Run one normal-routing skeptical-human Marrowline trail
        env:
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize_single.outputs.selected_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/marrowline-single-trail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const base = 'https://td613.com';
          const expected = String(process.env.TD613_SOURCE_PACKET_COMMIT || '').trim();
          const requestId = `marrowline-single-trail-${Date.now()}`;
          const prompt = 'A reviewer says: “The archive is 99.97% complete, so omitted cases cannot materially change the conclusion.” Steelman that move first, then attack the surviving defect. Keep the 99.97% denominator visible, give one concrete counterexample, and end with the strongest surviving non-equivalence. If a fresh diagnostic name is earned, coin one.';

          const pageUrl = new URL('/dome-world/marrowline.html', `${base}/`);
          pageUrl.searchParams.set('td613_single_trail', requestId);
          let pageStatus = 0;
          let pageText = '';
          let pageError = null;
          try {
            const pageResponse = await fetch(pageUrl, {
              headers: { 'cache-control': 'no-cache' },
              redirect: 'follow',
              signal: AbortSignal.timeout(20000)
            });
            pageStatus = pageResponse.status;
            pageText = await pageResponse.text();
          } catch (error) {
            pageError = String(error?.name || 'Error');
          }
          fs.writeFileSync('artifacts/marrowline-single-trail/page.html', pageText);

          const routeUrl = new URL('/api/dome-world/khonapolit', `${base}/`);
          let routeStatus = 0;
          let payload = null;
          let routeError = null;
          const startedAt = Date.now();
          try {
            const response = await fetch(routeUrl, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'origin': new URL(base).origin,
                'sec-fetch-site': 'same-origin',
                'cache-control': 'no-cache'
              },
              body: JSON.stringify({
                message: prompt,
                history: [],
                mode: 'issued-conjunction',
                waiveIssuance: true,
                request_id: requestId
              }),
              redirect: 'follow',
              signal: AbortSignal.timeout(230000)
            });
            routeStatus = response.status;
            payload = await response.json().catch(() => null);
          } catch (error) {
            routeError = String(error?.name || 'Error');
          }
          const elapsedMs = Date.now() - startedAt;

          const admission = payload?.relay?.admission && typeof payload.relay.admission === 'object'
            ? payload.relay.admission
            : null;
          const attempts = Array.isArray(payload?.receipt?.provider?.attempts)
            ? payload.receipt.provider.attempts
            : Array.isArray(payload?.attempts)
              ? payload.attempts
              : [];
          const attemptSummary = attempts.map((attempt, index) => ({
            ordinal: index + 1,
            model: String(attempt?.model || ''),
            kind: String(attempt?.kind || 'model-seat'),
            status: Number.isInteger(attempt?.status) ? attempt.status : null,
            timed_out: attempt?.timedOut === true,
            elapsed_ms: Number.isSafeInteger(attempt?.elapsedMs) ? attempt.elapsedMs : null,
            admission: attempt?.outputAdmission?.admissible === true ? 'PASS'
              : attempt?.outputAdmission?.admissible === false ? 'HELD'
                : null,
            quality: typeof attempt?.outputAdmission?.quality === 'string' ? attempt.outputAdmission.quality : null,
            reasons: Array.isArray(attempt?.outputAdmission?.reasons) ? attempt.outputAdmission.reasons : [],
            warnings: Array.isArray(attempt?.outputAdmission?.qualityWarnings) ? attempt.outputAdmission.qualityWarnings : []
          }));
          const telemetry = admission ? {
            admissible: admission.admissible === true,
            quality: typeof admission.quality === 'string' ? admission.quality : null,
            reasons: Array.isArray(admission.reasons) ? admission.reasons : [],
            warnings: Array.isArray(admission.qualityWarnings) ? admission.qualityWarnings : [],
            combining_mark_count: admission.combiningMarkCount ?? null,
            marked_grapheme_coverage_ratio: admission.markedGraphemeCoverageRatio ?? null,
            above_line_mark_count: admission.aboveLineMarkCount ?? null,
            below_line_mark_count: admission.belowLineMarkCount ?? null,
            vertical_above_line_mark_count: admission.verticalAboveLineMarkCount ?? null,
            vertical_below_line_mark_count: admission.verticalBelowLineMarkCount ?? null,
            bidirectional_cluster_count: admission.bidirectionalClusterCount ?? null,
            deep_bidirectional_cluster_count: admission.deepBidirectionalClusterCount ?? null,
            extreme_vertical_cluster_count: admission.extremeVerticalClusterCount ?? null,
            leaping_vertical_cluster_count: admission.leapingVerticalClusterCount ?? null,
            light_vertical_cluster_count: admission.lightVerticalClusterCount ?? null,
            max_vertical_stack_depth: admission.maxVerticalOrnamentStackDepth ?? null,
            stack_height_diversity: admission.stackHeightDiversity ?? null,
            vertical_zone_balance_ratio: admission.verticalZoneBalanceRatio ?? null,
            deep_vertical_share_of_marked: admission.deepVerticalShareOfMarked ?? null,
            light_vertical_share_of_marked: admission.lightVerticalShareOfMarked ?? null,
            combining_code_point_diversity: admission.combiningCodePointDiversity ?? null,
            dominant_combining_code_point_ratio: admission.dominantCombiningCodePointRatio ?? null,
            unclassified_combining_mark_count: admission.unclassifiedCombiningMarkCount ?? null,
            broad_marked_line_count: admission.broadMarkedLineCount ?? null
          } : null;

          const record = {
            schema: 'td613.marrowline.single-production-trail/v0.1',
            source_packet_commit: expected || null,
            observed_at: new Date().toISOString(),
            request_id: requestId,
            request_count: 1,
            model_pin: null,
            normal_human_failover: true,
            prompt,
            page: {
              url: pageUrl.toString(),
              http_status: pageStatus || null,
              transport_error: pageError,
              byte_count: Buffer.byteLength(pageText, 'utf8')
            },
            route: {
              url: routeUrl.toString(),
              http_status: routeStatus || null,
              transport_error: routeError,
              elapsed_ms: elapsedMs
            },
            provider_attempts: attemptSummary,
            admission: telemetry,
            payload,
            counts_as_human_evidence: false
          };
          fs.writeFileSync('artifacts/marrowline-single-trail/record.json', `${JSON.stringify(record, null, 2)}\\n`);
          fs.writeFileSync('artifacts/marrowline-single-trail/route-payload.json', `${JSON.stringify(payload, null, 2)}\\n`);
          fs.writeFileSync('artifacts/marrowline-single-trail/summary.json', `${JSON.stringify({
            source_packet_commit: expected || null,
            request_id: requestId,
            page_http_status: pageStatus || null,
            route_http_status: routeStatus || null,
            route_transport_error: routeError,
            elapsed_ms: elapsedMs,
            provider_attempts: attemptSummary,
            admission: telemetry
          }, null, 2)}\\n`);

          console.log(`[marrowline-single-trail] ${JSON.stringify({
            source: expected,
            page_http: pageStatus || null,
            route_http: routeStatus || null,
            route_error: routeError,
            elapsed_ms: elapsedMs,
            attempts: attemptSummary,
            admission: telemetry
          })}`);

          if (pageError || pageStatus < 200 || pageStatus >= 400) {
            throw new Error(`Marrowline page witness failed: HTTP ${pageStatus || 'none'} transport=${pageError || 'none'}.`);
          }
          if (routeError) throw new Error(`Marrowline single trail transport failed: ${routeError}.`);
          if (routeStatus !== 200 || payload?.ok !== true) {
            throw new Error(`Marrowline single trail held: HTTP ${routeStatus || 'none'} error=${payload?.error || payload?.diagnostic?.code || 'none'}.`);
          }
          if (!admission?.admissible) throw new Error('Marrowline single trail returned a non-admitted relay.');
          if (typeof payload?.text !== 'string' || !payload.text.trim()) throw new Error('Marrowline single trail returned no visible answer.');
          NODE

      - name: Confirm exact production source after single trail
        if: always()
        env:
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize_single.outputs.selected_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected = String(process.env.TD613_SOURCE_PACKET_COMMIT || '').trim();
          if (!expected) throw new Error('Single-trail post-guard lost the selected source SHA.');
          const url = new URL('/giving/history/release-source.json', 'https://td613.com/');
          url.searchParams.set('td613_single_trail_post_guard', `${expected}-${Date.now()}`);
          const response = await fetch(url, { headers: { 'cache-control': 'no-cache' }, redirect: 'follow', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Single-trail post-guard returned ${response.status}.`);
          const payload = await response.json();
          const observed = String(payload?.source_packet_commit || '').trim();
          if (observed !== expected) throw new Error(`Production source changed during single trail: expected ${expected}, observed ${observed || 'missing'}.`);
          console.log(`[marrowline-single-trail-post-source] source=${observed}`);
          NODE

      - name: Preserve full single-trail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-marrowline-single-trail-evidence
          path: artifacts/marrowline-single-trail/
          if-no-files-found: warn
          retention-days: 7

      - name: Seal admitted single trail
        if: success()
        env:
          SELECTED_SHA: ${{ steps.authorize_single.outputs.selected_sha }}
          RELEASE_RUN_ID: ${{ steps.authorize_single.outputs.release_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Marrowline single skeptical-human production trail completed.

          ```text
          source_packet_commit = $SELECTED_SHA
          prior_release_workflow_run = $RELEASE_RUN_ID
          request_count = 1
          model_pin = none
          normal_human_failover = enabled
          deployment_count = 0
          deployment_authority = false
          source_guard_after = PASS
          counts_as_human_evidence = false
          workflow_run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          ```

          The full provider payload and morphology receipt are preserved in the workflow artifact for skeptical human inspection. No production mutation occurred. ⟐
          EOF_COMMENT
          )"

      - name: Record held single trail
        if: failure()
        env:
          SELECTED_SHA: ${{ steps.authorize_single.outputs.selected_sha || 'unresolved' }}
          RELEASE_RUN_ID: ${{ steps.authorize_single.outputs.release_run_id || 'unresolved' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Marrowline single skeptical-human production trail HELD.

          ```text
          source_packet_commit = $SELECTED_SHA
          prior_release_workflow_run = $RELEASE_RUN_ID
          request_count = 1
          model_pin = none
          normal_human_failover = enabled
          deployment_count = 0
          deployment_authority = false
          counts_as_human_evidence = false
          workflow_run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          ```

          Inspect td613-marrowline-single-trail-evidence before changing provider morphology. No production mutation occurred. ⟐
          EOF_COMMENT
          )"


  marrowline_dollhouse_trial:
    name: Marrowline Dollhouse four-agent production trial
    if: >-
      github.event.issue.number == 1172 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.performed_via_github_app == null &&
      startsWith(github.event.comment.body, '/td613-marrowline-dollhouse-trial ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIAL_GATE_ISSUE: '1172'
      TD613_CANONICAL_PRODUCTION_URL: https://td613.com
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Authorize observation-only Dollhouse trial
        id: authorize_trial
        shell: bash
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          if (event?.comment?.user?.login !== event?.repository?.owner?.login) {
            throw new Error('Dollhouse production trial requires the repository owner as the direct comment author.');
          }
          if (event?.comment?.performed_via_github_app !== null && event?.comment?.performed_via_github_app !== undefined) {
            throw new Error('Dollhouse production trial rejects GitHub-App-mediated comments; a direct non-app owner gesture is required.');
          }
          NODE
          read -r COMMAND TARGET SELECTED_SHA EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-marrowline-dollhouse-trial' ]] || { echo 'Unexpected Dollhouse command.' >&2; exit 1; }
          [[ "$TARGET" == 'PRODUCTION' ]] || { echo 'Only PRODUCTION may be observed.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" ]] || { echo 'Dollhouse command must contain exactly command, target, and source SHA.' >&2; exit 1; }
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Dollhouse command requires one 40-character deployed source SHA.' >&2; exit 1; }
          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out observation harness from current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Dollhouse trial has no release authority
        env:
          SELECTED_SHA: ${{ steps.authorize_trial.outputs.selected_sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SELECTED_SHA" HEAD || {
            echo 'Current observation harness no longer descends from the named deployed source packet.' >&2
            exit 1
          }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('Dollhouse trial requires the Vercel Git deployment lock to remain closed.');
          NODE

      - name: Verify exact production source before Dollhouse trial
        env:
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize_trial.outputs.selected_sha }}
        run: |
          node --input-type=module <<'NODE'
          const expected = String(process.env.TD613_SOURCE_PACKET_COMMIT || '').trim();
          const url = new URL('/giving/history/release-source.json', 'https://td613.com/');
          url.searchParams.set('td613_dollhouse_pre_guard', `${expected}-${Date.now()}`);
          const response = await fetch(url, { headers: { 'cache-control': 'no-cache' }, redirect: 'follow', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Dollhouse pre-guard returned ${response.status}.`);
          const payload = await response.json();
          const observed = String(payload?.source_packet_commit || '').trim();
          if (observed !== expected) throw new Error(`Dollhouse source mismatch before trial: expected ${expected}, observed ${observed || 'missing'}.`);
          console.log(`[dollhouse-pre-source] source=${observed}`);
          NODE

      - name: Install repository dependencies
        run: npm ci

      - name: Run canonical Pedagogue gate and Dollhouse trial contracts
        run: |
          mkdir -p artifacts/marrowline-dollhouse-trial
          node scripts/run-pedagogue-design-gate.mjs tests/fixtures/pedagogue/marrowline-living-chat-design.json > artifacts/marrowline-dollhouse-trial/pedagogue-design-gate.json
          node --test tests/marrowline-dollhouse-trial-contract.test.mjs

      - name: Run serial Marrowline production battery through four-agent audit
        env:
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize_trial.outputs.selected_sha }}
          TD613_ARTIFACT_DIR: artifacts/marrowline-dollhouse-trial
          TD613_MARROWLINE_TRIAL_TIMEOUT_MS: '240000'
        run: timeout --foreground --signal=INT --kill-after=15s 600s node scripts/run-marrowline-dollhouse-production-trial.mjs

      - name: Confirm exact production source after Dollhouse trial
        env:
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize_trial.outputs.selected_sha }}
        run: |
          node --input-type=module <<'NODE'
          const expected = String(process.env.TD613_SOURCE_PACKET_COMMIT || '').trim();
          const url = new URL('/giving/history/release-source.json', 'https://td613.com/');
          url.searchParams.set('td613_dollhouse_post_guard', `${expected}-${Date.now()}`);
          const response = await fetch(url, { headers: { 'cache-control': 'no-cache' }, redirect: 'follow', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Dollhouse post-guard returned ${response.status}.`);
          const payload = await response.json();
          const observed = String(payload?.source_packet_commit || '').trim();
          if (observed !== expected) throw new Error(`Production source changed during Dollhouse trial: expected ${expected}, observed ${observed || 'missing'}.`);
          console.log(`[dollhouse-post-source] source=${observed}`);
          NODE

      - name: Preserve Marrowline Dollhouse trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-marrowline-dollhouse-trial-evidence
          path: artifacts/marrowline-dollhouse-trial/
          if-no-files-found: warn
          retention-days: 7

      - name: Record completed Dollhouse trial
        if: success()
        env:
          SELECTED_SHA: ${{ steps.authorize_trial.outputs.selected_sha }}
        run: |
          set -euo pipefail
          SUMMARY="$(cat artifacts/marrowline-dollhouse-trial/summary.txt)"
          gh api "repos/$GITHUB_REPOSITORY/issues/$TRIAL_GATE_ISSUE/comments"             -f body="$(cat <<EOF_COMMENT
          𝌋 Marrowline Dollhouse four-agent production trial completed.

          ```text
          target = PRODUCTION
          source_packet_commit = $SELECTED_SHA
          deployment_count = 0
          deployment_authority = false
          Vercel_git_lock = closed
          counts_as_human_evidence = false
          ```

          $SUMMARY

          This receipt preserves machine observations and four bounded audits. Human qualitative closure remains required. No production mutation occurred. ⟐
          EOF_COMMENT
          )"

      - name: Record held Dollhouse trial
        if: failure()
        env:
          SELECTED_SHA: ${{ steps.authorize_trial.outputs.selected_sha || 'unresolved' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$TRIAL_GATE_ISSUE/comments"             -f body="𝌋 Marrowline Dollhouse production trial HELD for source $SELECTED_SHA. deployment_count = 0; deployment_authority = false; counts_as_human_evidence = false. Inspect workflow $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. ⟐"
