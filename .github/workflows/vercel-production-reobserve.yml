name: Vercel Production Witness Re-observation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

# Workflow-level concurrency is evaluated before the job-level command guard.
# A normal release comment must therefore not let this observation-only wrapper
# consume one of the shared production slots before it has proved its command.
concurrency:
  group: >-
    ${{ startsWith(github.event.comment.body, '/td613-production-reobserve ')
        && 'td613-vercel-production-release'
        || format('td613-vercel-production-reobserve-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  reobserve:
    if: >-
      github.event.issue.number == 405 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.user.login == github.repository_owner || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
      startsWith(github.event.comment.body, '/td613-production-reobserve ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_GATE_ISSUE: '405'
      TD613_CANONICAL_PRODUCTION_URL: https://td613.com
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate observation-only operator authorization
        id: authorize
        shell: bash
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r COMMAND TARGET SELECTED_SHA HELD_RUN_ID EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-production-reobserve' ]] || { echo 'Unexpected re-observation command.' >&2; exit 1; }
          [[ "$TARGET" == 'PRODUCTION' ]] || { echo 'Only the explicitly named PRODUCTION target is accepted.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" ]] || { echo 'Re-observation command must contain exactly command, target, source SHA, and prior held run ID.' >&2; exit 1; }
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Re-observation command omitted a valid 40-character source SHA.' >&2; exit 1; }
          [[ "$HELD_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Re-observation command omitted a numeric prior held workflow run ID.' >&2; exit 1; }
          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "held_run_id=$HELD_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Check out the exact deployed source packet
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authorize.outputs.selected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify observation lane has no deployment authority
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('Observation-only witness requires the Git deployment lock to be closed in the selected source packet.');
          NODE

      - name: Admit only a prior provider-transport HELD release
        env:
          SELECTED_SHA: ${{ steps.authorize.outputs.selected_sha }}
          HELD_RUN_ID: ${{ steps.authorize.outputs.held_run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/reobserve-authority artifacts/prior-held

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HELD_RUN_ID" > artifacts/reobserve-authority/prior-run.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync('artifacts/reobserve-authority/prior-run.json', 'utf8'));
          const heldRunId = Number(process.env.HELD_RUN_ID);
          if (run.id !== heldRunId) throw new Error(`Prior run identity mismatch: expected ${heldRunId}, observed ${run.id ?? 'missing'}.`);
          if (run.name !== 'Vercel Operator Release') throw new Error(`Prior run is not the governed Vercel Operator Release: ${run.name || 'missing'}.`);
          if (run.event !== 'issue_comment') throw new Error(`Prior run did not originate from the governed issue-comment conduit: ${run.event || 'missing'}.`);
          if (run.head_branch !== 'main') throw new Error(`Prior held release did not execute from main: ${run.head_branch || 'missing'}.`);
          if (run.conclusion !== 'failure') throw new Error(`Prior run is not historically HELD/failed: ${run.conclusion || 'missing'}.`);
          NODE

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HELD_RUN_ID/artifacts?name=td613-bounded-production-release-evidence" > artifacts/reobserve-authority/prior-artifacts.json
          ARTIFACT_COUNT="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('artifacts/reobserve-authority/prior-artifacts.json', 'utf8'));
          const artifacts = Array.isArray(payload.artifacts) ? payload.artifacts.filter(item => item?.name === 'td613-bounded-production-release-evidence' && item?.expired !== true) : [];
          if (artifacts.length !== 1) throw new Error(`Expected exactly one live held-release evidence artifact, observed ${artifacts.length}.`);
          process.stdout.write(String(artifacts.length));
          NODE
          )"
          [[ "$ARTIFACT_COUNT" == '1' ]]
          gh run download "$HELD_RUN_ID" -n td613-bounded-production-release-evidence -D artifacts/prior-held

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const selectedSha = String(process.env.SELECTED_SHA || '').trim();
          const heldRunId = Number(process.env.HELD_RUN_ID);
          const receiptPath = path.join('artifacts', 'prior-held', 'loom-production-canary', 'receipt.json');
          if (!fs.existsSync(receiptPath)) throw new Error('Prior held release preserved no Loom production canary receipt.');
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));

          if (receipt.source_packet_commit !== selectedSha) {
            throw new Error(`Prior HELD receipt source mismatch: expected ${selectedSha}, observed ${receipt.source_packet_commit || 'missing'}.`);
          }
          if (receipt.counts_as_human_evidence !== false) throw new Error('Prior HELD receipt must remain explicitly non-human evidence.');

          const marrow = receipt.marrowline_live_route && typeof receipt.marrowline_live_route === 'object'
            ? receipt.marrowline_live_route
            : {};
          const marrowProviderHeld = !marrow.transport_error_class
            && (marrow.http_status !== 200 || marrow.ok !== true)
            && marrow.diagnostic?.stage === 'provider-transport'
            && marrow.diagnostic?.code === 'PROVIDER_UNAVAILABLE';
          const marrowPassedAdmission = !marrow.transport_error_class
            && marrow.http_status === 200
            && marrow.ok === true
            && marrow.answer_nonempty === true
            && marrow.relay_admitted === true;
          const loomProviderHeld = !receipt.transport_error_class
            && (receipt.http_status !== 200 || receipt.task_status !== 'completed')
            && receipt.diagnostic?.stage === 'provider-transport'
            && receipt.diagnostic?.code === 'PROVIDER_HTTP_ERROR';

          // Preserve the production canary's real fail order. Marrowline is adjudicated
          // first; Loom may authorize provider re-observation only after Marrowline
          // already passed its transport, human-visible answer, and relay admission.
          const firstFailureWasProviderTransport = marrowProviderHeld || (marrowPassedAdmission && loomProviderHeld);
          if (!firstFailureWasProviderTransport) {
            throw new Error('Prior HELD release was not first-failed by provider transport; observation-only re-witness is inadmissible.');
          }

          const artifactPayload = JSON.parse(fs.readFileSync('artifacts/reobserve-authority/prior-artifacts.json', 'utf8'));
          const artifact = artifactPayload.artifacts.find(item => item?.name === 'td613-bounded-production-release-evidence' && item?.expired !== true);
          const authority = {
            schema: 'td613.production-witness-reobservation-authority/v0.1',
            selected_source_packet_commit: selectedSha,
            prior_held_workflow_run: heldRunId,
            prior_release_state: 'HELD_UNCHANGED',
            prior_first_failure_class: 'provider-transport',
            prior_artifact_id: artifact?.id ?? null,
            prior_artifact_digest: typeof artifact?.digest === 'string' ? artifact.digest : null,
            deployment_authority: false,
            counts_as_human_evidence: false,
            admitted_at: new Date().toISOString()
          };
          fs.writeFileSync('artifacts/reobserve-authority/authority.json', `${JSON.stringify(authority, null, 2)}\n`);
          NODE

      - name: Record accepted observation-only gesture
        env:
          SELECTED_SHA: ${{ steps.authorize.outputs.selected_sha }}
          HELD_RUN_ID: ${{ steps.authorize.outputs.held_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Production witness re-observation gesture accepted.

          \`\`\`text
          target = PRODUCTION
          source_packet_commit = $SELECTED_SHA
          prior_held_workflow_run = $HELD_RUN_ID
          deployment_count = 0
          deployment_authority = false
          prior_release_state = HELD_UNCHANGED
          witness_scope = exact-source parity + Loom/Marrowline live AI canary
          counts_as_human_evidence = false
          workflow_run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          \`\`\`

          This conduit can re-observe an unchanged production source after a provider-transport hold. It cannot deploy, relock, rewrite the earlier release state, or convert later liveness into retroactive success. ⟐
          EOF_COMMENT
          )"

      - name: Install repository dependencies
        run: npm ci

      - name: Verify exact source receipt before re-observation
        env:
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://td613.com';
          const expected = String(process.env.TD613_SOURCE_PACKET_COMMIT || '').trim();
          const url = new URL('/giving/history/release-source.json', `${base}/`);
          url.searchParams.set('td613_reobserve_pre_guard', `${expected}-${Date.now()}`);
          const response = await fetch(url, { headers: { 'cache-control': 'no-cache' }, redirect: 'follow', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Pre-witness release receipt returned ${response.status}.`);
          const payload = await response.json();
          const observed = String(payload?.source_packet_commit || '').trim();
          if (observed !== expected) throw new Error(`Re-observation source mismatch before witness: expected ${expected}, observed ${observed || 'missing'}.`);
          console.log(`[td613-reobserve-pre-source] source=${observed}`);
          NODE

      - name: Verify deployed bytes before re-observation
        env:
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_ARTIFACT_DIR: artifacts/reobserve-exact-source-before
          TD613_PROBE_ATTEMPTS: '1'
          TD613_PROBE_DELAY_MS: '0'
        run: node scripts/flowcore-release-content-probe.mjs

      - name: Re-observe Loom Demo 1 and independent Marrowline live route
        env:
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_ARTIFACT_DIR: artifacts/loom-production-reobserve
        run: timeout --foreground --signal=INT --kill-after=10s 140s node scripts/loom-production-canary.mjs

      - name: Confirm exact source receipt after re-observation
        env:
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://td613.com';
          const expected = String(process.env.TD613_SOURCE_PACKET_COMMIT || '').trim();
          const url = new URL('/giving/history/release-source.json', `${base}/`);
          url.searchParams.set('td613_reobserve_post_guard', `${expected}-${Date.now()}`);
          const response = await fetch(url, { headers: { 'cache-control': 'no-cache' }, redirect: 'follow', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Post-witness release receipt returned ${response.status}.`);
          const payload = await response.json();
          const observed = String(payload?.source_packet_commit || '').trim();
          if (observed !== expected) throw new Error(`Production source changed during re-observation: expected ${expected}, observed ${observed || 'missing'}.`);
          console.log(`[td613-reobserve-post-source] source=${observed}`);
          NODE

      - name: Reconfirm deployed bytes after re-observation
        env:
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize.outputs.selected_sha }}
          TD613_ARTIFACT_DIR: artifacts/reobserve-exact-source-after
          TD613_PROBE_ATTEMPTS: '1'
          TD613_PROBE_DELAY_MS: '0'
        run: node scripts/flowcore-release-content-probe.mjs

      - name: Preserve bounded re-observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-production-witness-reobservation-evidence
          path: |
            artifacts/reobserve-authority/
            artifacts/loom-production-reobserve/
            artifacts/reobserve-exact-source-before/
            artifacts/reobserve-exact-source-after/
          if-no-files-found: warn
          retention-days: 7

      - name: Seal successful unchanged-source re-observation
        if: success()
        env:
          SELECTED_SHA: ${{ steps.authorize.outputs.selected_sha }}
          HELD_RUN_ID: ${{ steps.authorize.outputs.held_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Production witness re-observation completed on the unchanged source.

          \`\`\`text
          source_packet_commit = $SELECTED_SHA
          prior_held_workflow_run = $HELD_RUN_ID
          prior_release_state = HELD_UNCHANGED
          deployment_count = 0
          exact_source_pre_guard = PASS
          exact_source_content_before = PASS
          production_loom_demo1_canary = PASS
          post_witness_source_guard = PASS
          exact_source_content_after = PASS
          counts_as_human_evidence = false
          child_study_authorized = false
          public_route_promotion_authorized = false
          retroactive_release_rewrite = false
          \`\`\`

          This later witness supplements the historical HELD release without rewriting its earlier epistemic state. No Vercel deployment occurred. Sealed ⟐
          EOF_COMMENT
          )"

      - name: Record held re-observation
        if: failure()
        env:
          SELECTED_SHA: ${{ steps.authorize.outputs.selected_sha || 'unresolved' }}
          HELD_RUN_ID: ${{ steps.authorize.outputs.held_run_id || 'unresolved' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Production witness re-observation held.

          \`\`\`text
          source_packet_commit = $SELECTED_SHA
          prior_held_workflow_run = $HELD_RUN_ID
          prior_release_state = HELD_UNCHANGED
          deployment_count = 0
          deployment_authority = false
          retroactive_release_rewrite = false
          workflow_run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          \`\`\`

          The observation-only conduit changed no production source and created no deployment authority. This failed observation authorizes neither a deployment nor a historical-state rewrite. ⟐
          EOF_COMMENT
          )"
