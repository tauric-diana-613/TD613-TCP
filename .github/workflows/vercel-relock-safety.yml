name: Vercel Relock Safety

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: td613-vercel-production-release
  cancel-in-progress: false

jobs:
  relock-safety:
    if: >-
      github.event.issue.number == 405 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/td613-vercel-release ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_GATE_ISSUE: '405'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out live main after the release lane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate authorized source ancestry and close stranded lock
        id: relock
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          read -r COMMAND TARGET SELECTED_SHA EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-vercel-release' ]] || { echo 'Unexpected command.' >&2; exit 1; }
          [[ "$TARGET" == 'PRODUCTION' ]] || { echo 'Unexpected target.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" && "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Malformed release command.' >&2; exit 1; }

          git fetch origin main
          git reset --hard origin/main
          git merge-base --is-ancestor "$SELECTED_SHA" HEAD || {
            echo 'Live main no longer descends from the authorized source packet.' >&2
            exit 1
          }

          LOCK_STATE="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          process.stdout.write(String(config.git?.deploymentEnabled));
          NODE
          )"

          if [[ "$LOCK_STATE" == 'false' ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "relock_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$LOCK_STATE" == 'true' ]] || { echo "Unexpected Vercel lock state: $LOCK_STATE" >&2; exit 1; }

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'vercel.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.git = { ...(config.git || {}), deploymentEnabled: false };
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel.json
          git commit -m "release: safety-relock Vercel for $SELECTED_SHA"
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "relock_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record relock safety receipt
        if: success()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Vercel relock safety completed.

          \`\`\`text
          source_packet_commit = $(awk '{print $3}' <<< '${{ github.event.comment.body }}')
          safety_relock_changed_main = ${{ steps.relock.outputs.changed }}
          relock_commit = ${{ steps.relock.outputs.relock_sha }}
          git_auto_deploy = disabled
          deployment_count = 0
          \`\`\`

          This queued safety membrane creates no deployment. It only closes a stranded Git deployment lock on the latest descendant of the authorized source packet. Sealed ⟐
          EOF_COMMENT
          )"

      - name: Record relock safety hold
        if: failure()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="𝌋 Vercel relock safety held. No deployment or retry authority follows. Inspect workflow $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. ⟐"

  confirm-production-practice:
    if: >-
      github.event.issue.number == 405 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.user.login == github.repository_owner || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
      startsWith(github.event.comment.body, '/td613-vercel-confirm ')
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_GATE_ISSUE: '405'
      TD613_CANONICAL_PRODUCTION_URL: https://td613.com
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out current relocked main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authorize zero-deploy production confirmation
        id: authorize_confirmation
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          read -r COMMAND TARGET SELECTED_SHA EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-vercel-confirm' ]] || { echo 'Unexpected confirmation command.' >&2; exit 1; }
          [[ "$TARGET" == 'PRODUCTION' ]] || { echo 'Only PRODUCTION may be confirmed.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" && "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Malformed confirmation command.' >&2; exit 1; }
          git merge-base --is-ancestor "$SELECTED_SHA" HEAD || {
            echo 'Current main no longer descends from the deployed source packet.' >&2
            exit 1
          }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) throw new Error('Read-only confirmation requires the Vercel Git deployment lock to remain closed.');
          NODE
          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "observer_main=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record accepted read-only confirmation gesture
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Zero-deploy production confirmation accepted.

          \`\`\`text
          source_packet_commit = ${{ steps.authorize_confirmation.outputs.selected_sha }}
          observer_main = ${{ steps.authorize_confirmation.outputs.observer_main }}
          target = PRODUCTION
          deployment_ceiling = 0
          browser = Chromium
          git_auto_deploy = disabled
          relay = ${{ github.event.comment.user.login }}
          workflow_run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          \`\`\`

          This route may observe the already-deployed practice surface and exact-source receipt only. It cannot deploy, unlock Vercel Git integration, mutate application source, or grant release authority. ⟐
          EOF_COMMENT
          )"

      - name: Install repository dependencies once
        run: npm ci

      - name: Verify confirmation and practice contracts
        run: |
          node tests/release-plumbing.test.mjs
          node tests/vercel-relock-safety.test.mjs
          node tests/giving-post640-polish.test.mjs
          node tests/pedagogue-practice-fixture.test.mjs

      - name: Verify deployed source packet before browser observation
        env:
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize_confirmation.outputs.selected_sha }}
          TD613_ARTIFACT_DIR: artifacts/practice-production-confirmation/exact-source-before
          TD613_PROBE_ATTEMPTS: '1'
          TD613_PROBE_DELAY_MS: '0'
        run: node scripts/flowcore-release-content-probe.mjs

      - name: Install one read-only production browser engine
        run: |
          npm install --no-save --package-lock=false playwright@1.53.2
          npx playwright install --with-deps chromium

      - name: Confirm already-deployed canonical practice fixture on Chromium
        env:
          TD613_BROWSER: chromium
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_PRODUCTION_OBSERVATION: 'true'
          TD613_PRACTICE_OBSERVATION: 'true'
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize_confirmation.outputs.selected_sha }}
          TD613_GIVING_PROBE_ATTEMPTS: '12'
          TD613_GIVING_PROBE_DELAY_MS: '5000'
          TD613_GIVING_PROBE_REQUEST_TIMEOUT_MS: '15000'
          TD613_ARTIFACT_DIR: artifacts/practice-production-confirmation/browser
        run: timeout --foreground --signal=INT --kill-after=15s 600s node scripts/giving-browser-probe.mjs

      - name: Reconfirm deployed source packet after browser observation
        env:
          TD613_BASE_URL: ${{ env.TD613_CANONICAL_PRODUCTION_URL }}
          TD613_SOURCE_PACKET_COMMIT: ${{ steps.authorize_confirmation.outputs.selected_sha }}
          TD613_ARTIFACT_DIR: artifacts/practice-production-confirmation/exact-source-after
          TD613_PROBE_ATTEMPTS: '1'
          TD613_PROBE_DELAY_MS: '0'
        run: node scripts/flowcore-release-content-probe.mjs

      - name: Preserve zero-deploy production confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td613-zero-deploy-practice-production-confirmation
          path: artifacts/practice-production-confirmation/
          if-no-files-found: warn
          retention-days: 7

      - name: Seal zero-deploy production confirmation
        if: success()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Already-deployed Giving practice confirmation passed.

          \`\`\`text
          source_packet_commit = ${{ steps.authorize_confirmation.outputs.selected_sha }}
          observer_main = ${{ steps.authorize_confirmation.outputs.observer_main }}
          target = PRODUCTION
          deployment_count = 0
          exact_source_before = PASS
          production_practice_fixture = PASS
          exact_source_after = PASS
          browser = Chromium
          git_auto_deploy = disabled
          application_mutation = none
          repository_write_authority = false
          counts_as_human_evidence = false
          automatic_release_authority = false
          \`\`\`

          The already-deployed source packet remained owner of production before and after the CSP-safe practice witness. This confirmation created no deployment and changed no application bytes. Sealed ⟐
          EOF_COMMENT
          )"

      - name: Record zero-deploy confirmation hold
        if: failure()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="𝌋 Zero-deploy production confirmation held. deployment_count = 0; git_auto_deploy remains disabled; no deployment, unlock, retry, or application-mutation authority follows. Inspect workflow $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. ⟐"

  src-zenodo-sync:
    if: >-
      github.event.issue.number == 758 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.user.login == github.repository_owner || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
      github.event.comment.body == '/src-zenodo-sync ATELIER'
    permissions:
      contents: write
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GATE_ISSUE: '758'
      ATELIER_PR: '731'
      ATELIER_BRANCH: amari/src-projective-routing-grammar
      SRC_ROOT: packages/dome_world_exact/fixtures/a15-r0/SRC
      CREATOR_ORCID: 0009-0009-9348-3534
      SYNC_SUMMARY: /tmp/src-zenodo-sync-summary.json

    steps:
      - name: Record accepted SRC sync gesture
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 SRC Zenodo sync gesture accepted.

          \`\`\`text
          command = /src-zenodo-sync ATELIER
          relay = ${{ github.event.comment.user.login }}
          target_branch = $ATELIER_BRANCH
          target_pr = #$ATELIER_PR
          creator_orcid = $CREATOR_ORCID
          run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          authority = one bounded public-Zenodo delta sync
          \`\`\`

          No merge, seal promotion, scientific promotion, publication, production, or Vercel authority is created. ⟐
          EOF_COMMENT
          )"

      - name: Verify configured live Atelier surface
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ATELIER_PR")"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          MERGED="$(jq -r '.merged' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          [[ "$STATE" == 'open' ]] || { echo "Atelier PR #$ATELIER_PR is not open." >&2; exit 1; }
          [[ "$MERGED" == 'false' ]] || { echo "Atelier PR #$ATELIER_PR is merged; rotate the gate target." >&2; exit 1; }
          [[ "$HEAD_REF" == "$ATELIER_BRANCH" ]] || { echo "Atelier branch mismatch: $HEAD_REF != $ATELIER_BRANCH" >&2; exit 1; }

      - name: Check out live Atelier branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ATELIER_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate SRC acquisition implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/src-zenodo-operator-sync.py
          python -m py_compile scripts/src-zenodo-operator-sync.py

      - name: Install bounded PDF text extractor
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<7'

      - name: Freeze pre-sync custody witnesses
        id: src_before
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "phase2_tree=$(git rev-parse HEAD:$SRC_ROOT/04-RECEIPTS/phase2)" >> "$GITHUB_OUTPUT"
          echo "phase2_manifest_tree=$(git rev-parse HEAD:$SRC_ROOT/01-MANIFESTS/phase2)" >> "$GITHUB_OUTPUT"

      - name: Run exact-creator Zenodo delta sync
        shell: bash
        run: |
          set -euo pipefail
          python scripts/src-zenodo-operator-sync.py \
            --root "$SRC_ROOT" \
            --creator-orcid "$CREATOR_ORCID" \
            --run-id "$GITHUB_RUN_ID" \
            --gate-issue "$GATE_ISSUE" \
            --relay-identity '${{ github.event.comment.user.login }}' \
            --atelier-branch "$ATELIER_BRANCH" \
            --summary-path "$SYNC_SUMMARY"
          jq . "$SYNC_SUMMARY"

      - name: Enforce SRC live-post-seal write membrane
        shell: bash
        env:
          BEFORE_PHASE2_TREE: ${{ steps.src_before.outputs.phase2_tree }}
          BEFORE_PHASE2_MANIFEST_TREE: ${{ steps.src_before.outputs.phase2_manifest_tree }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed = (
              'packages/dome_world_exact/fixtures/a15-r0/SRC/01-MANIFESTS/live/',
              'packages/dome_world_exact/fixtures/a15-r0/SRC/02-ORIGINALS/live/',
              'packages/dome_world_exact/fixtures/a15-r0/SRC/03-DERIVATIVES/text/live/',
              'packages/dome_world_exact/fixtures/a15-r0/SRC/04-RECEIPTS/live/',
          )
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z'])
          entries = [x for x in raw.decode('utf-8', errors='surrogateescape').split('\0') if x]
          paths = [entry[3:] for entry in entries]
          bad = [path for path in paths if not path.startswith(allowed)]
          if bad:
              raise SystemExit('Zenodo sync write membrane violated by: ' + ', '.join(bad))
          print(f'SRC live-path membrane PASS ({len(paths)} changed paths)')
          PY
          [[ "$(git rev-parse HEAD:$SRC_ROOT/04-RECEIPTS/phase2)" == "$BEFORE_PHASE2_TREE" ]]
          [[ "$(git rev-parse HEAD:$SRC_ROOT/01-MANIFESTS/phase2)" == "$BEFORE_PHASE2_MANIFEST_TREE" ]]

      - name: Commit one bounded SRC live-intake packet
        id: src_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in \
            "$SRC_ROOT/01-MANIFESTS/live" \
            "$SRC_ROOT/02-ORIGINALS/live" \
            "$SRC_ROOT/03-DERIVATIVES/text/live" \
            "$SRC_ROOT/04-RECEIPTS/live"; do
            [[ -e "$path" ]] && git add -A -- "$path"
          done
          git diff --cached --quiet && { echo 'No SRC live intake changes were produced.' >&2; exit 1; }
          git commit -m "src: operator Zenodo delta sync run $GITHUB_RUN_ID"
          AFTER_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:$ATELIER_BRANCH"
          echo "after_sha=$AFTER_SHA" >> "$GITHUB_OUTPUT"

      - name: Record completed SRC sync and return gate to dormant
        if: success()
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.src_before.outputs.head }}
          AFTER_SHA: ${{ steps.src_commit.outputs.after_sha }}
        run: |
          set -euo pipefail
          COUNT="$(jq -r '.new_record_count' "$SYNC_SUMMARY")"
          IDS="$(jq -r '.new_record_ids | join(", ")' "$SYNC_SUMMARY")"
          PARTIAL="$(jq -r '.partial_body_extraction_record_ids | join(", ")' "$SYNC_SUMMARY")"
          [[ -n "$IDS" ]] || IDS='none'
          [[ -n "$PARTIAL" ]] || PARTIAL='none'
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Zenodo delta sync complete.

          \`\`\`text
          run = $GITHUB_RUN_ID
          before_head = $BEFORE_SHA
          after_head = $AFTER_SHA
          new_record_count = $COUNT
          new_record_ids = $IDS
          partial_body_extraction = $PARTIAL
          target = $ATELIER_BRANCH / PR #$ATELIER_PR
          sealed_phase2_mutation = false
          A15-R0_scientific_mutation = false
          merge = false
          publication = false
          production = false
          \`\`\`

          Gate #$GATE_ISSUE returns to **DORMANT**. A later sync requires a fresh explicit operator gesture. ⟐
          EOF_COMMENT
          )"

      - name: Record held SRC sync
        if: failure()
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Zenodo delta sync **HELD**.

          \`\`\`text
          run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          target = $ATELIER_BRANCH / PR #$ATELIER_PR
          repository_push_after_failure = not authorized
          automatic_retry = not authorized
          \`\`\`

          The gate returns to **DORMANT**. A failed run creates no retry, merge, seal, publication, or production authority. ⟐
          EOF_COMMENT
          )"
