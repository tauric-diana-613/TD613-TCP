name: Vercel Relock Safety

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  relock-safety:
    if: >-
      github.event.issue.number == 405 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.user.login == github.repository_owner || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
      startsWith(github.event.comment.body, '/td613-vercel-relock ')
    concurrency:
      group: td613-vercel-production-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_GATE_ISSUE: '405'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out live main after the release lane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate authorized source ancestry and close stranded lock
        id: relock
        env:
          AUTHORIZATION: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          read -r COMMAND TARGET SELECTED_SHA EXTRA <<< "$AUTHORIZATION"
          [[ "$COMMAND" == '/td613-vercel-relock' ]] || { echo 'Unexpected relock-safety command.' >&2; exit 1; }
          [[ "$TARGET" == 'PRODUCTION' ]] || { echo 'Unexpected target.' >&2; exit 1; }
          [[ -z "${EXTRA:-}" && "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Malformed release command.' >&2; exit 1; }

          git fetch origin main
          git reset --hard origin/main
          git merge-base --is-ancestor "$SELECTED_SHA" HEAD || {
            echo 'Live main no longer descends from the authorized source packet.' >&2
            exit 1
          }

          LOCK_STATE="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          process.stdout.write(String(config.git?.deploymentEnabled));
          NODE
          )"

          if [[ "$LOCK_STATE" == 'false' ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "relock_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$LOCK_STATE" == 'true' ]] || { echo "Unexpected Vercel lock state: $LOCK_STATE" >&2; exit 1; }

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'vercel.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.git = { ...(config.git || {}), deploymentEnabled: false };
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel.json
          git commit -m "release: safety-relock Vercel for $SELECTED_SHA"
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "relock_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record relock safety receipt
        if: success()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Explicit Vercel relock safety completed.

          \`\`\`text
          source_packet_commit = $(awk '{print $3}' <<< '${{ github.event.comment.body }}')
          safety_relock_changed_main = ${{ steps.relock.outputs.changed }}
          relock_commit = ${{ steps.relock.outputs.relock_sha }}
          git_auto_deploy = disabled
          deployment_count = 0
          \`\`\`

          This explicit recovery membrane creates no deployment. It only closes a stranded Git deployment lock on the latest descendant of the authorized source packet. Ordinary /td613-vercel-release gestures do not trigger this job. Sealed ⟐
          EOF_COMMENT
          )"

      - name: Record relock safety hold
        if: failure()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$RELEASE_GATE_ISSUE/comments" \
            -f body="𝌋 Explicit Vercel relock safety held. No deployment or retry authority follows. Inspect workflow $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. ⟐"

  src-zenodo-sync:
    if: >-
      github.event.issue.number == 758 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.user.login == github.repository_owner || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
      github.event.comment.body == '/src-zenodo-sync ATELIER'
    permissions:
      contents: write
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GATE_ISSUE: '758'
      ATELIER_PR: '731'
      ATELIER_BRANCH: amari/src-projective-routing-grammar
      SRC_ROOT: packages/dome_world_exact/fixtures/a15-r0/SRC
      CREATOR_ORCID: 0009-0009-9348-3534
      SYNC_SUMMARY: /tmp/src-zenodo-sync-summary.json

    steps:
      - name: Record accepted SRC sync gesture
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 SRC Zenodo sync gesture accepted.

          \`\`\`text
          command = /src-zenodo-sync ATELIER
          relay = ${{ github.event.comment.user.login }}
          target_branch = $ATELIER_BRANCH
          target_pr = #$ATELIER_PR
          creator_orcid = $CREATOR_ORCID
          run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          authority = one bounded public-Zenodo delta sync
          \`\`\`

          No merge, seal promotion, scientific promotion, publication, production, or Vercel authority is created. ⟐
          EOF_COMMENT
          )"

      - name: Verify configured live Atelier surface
        shell: bash
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ATELIER_PR")"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          MERGED="$(jq -r '.merged' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          [[ "$STATE" == 'open' ]] || { echo "Atelier PR #$ATELIER_PR is not open." >&2; exit 1; }
          [[ "$MERGED" == 'false' ]] || { echo "Atelier PR #$ATELIER_PR is merged; rotate the gate target." >&2; exit 1; }
          [[ "$HEAD_REF" == "$ATELIER_BRANCH" ]] || { echo "Atelier branch mismatch: $HEAD_REF != $ATELIER_BRANCH" >&2; exit 1; }

      - name: Check out live Atelier branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ATELIER_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate SRC acquisition implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/src-zenodo-operator-sync.py
          python -m py_compile scripts/src-zenodo-operator-sync.py

      - name: Install bounded PDF text extractor
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<7'

      - name: Freeze pre-sync custody witnesses
        id: src_before
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "phase2_tree=$(git rev-parse HEAD:$SRC_ROOT/04-RECEIPTS/phase2)" >> "$GITHUB_OUTPUT"
          echo "phase2_manifest_tree=$(git rev-parse HEAD:$SRC_ROOT/01-MANIFESTS/phase2)" >> "$GITHUB_OUTPUT"

      - name: Run exact-creator Zenodo delta sync
        shell: bash
        run: |
          set -euo pipefail
          python scripts/src-zenodo-operator-sync.py \
            --root "$SRC_ROOT" \
            --creator-orcid "$CREATOR_ORCID" \
            --run-id "$GITHUB_RUN_ID" \
            --gate-issue "$GATE_ISSUE" \
            --relay-identity '${{ github.event.comment.user.login }}' \
            --atelier-branch "$ATELIER_BRANCH" \
            --summary-path "$SYNC_SUMMARY"
          jq . "$SYNC_SUMMARY"

      - name: Enforce SRC live-post-seal write membrane
        shell: bash
        env:
          BEFORE_PHASE2_TREE: ${{ steps.src_before.outputs.phase2_tree }}
          BEFORE_PHASE2_MANIFEST_TREE: ${{ steps.src_before.outputs.phase2_manifest_tree }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed = (
              'packages/dome_world_exact/fixtures/a15-r0/SRC/01-MANIFESTS/live/',
              'packages/dome_world_exact/fixtures/a15-r0/SRC/02-ORIGINALS/live/',
              'packages/dome_world_exact/fixtures/a15-r0/SRC/03-DERIVATIVES/text/live/',
              'packages/dome_world_exact/fixtures/a15-r0/SRC/04-RECEIPTS/live/',
          )
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z'])
          entries = [x for x in raw.decode('utf-8', errors='surrogateescape').split('\0') if x]
          paths = [entry[3:] for entry in entries]
          bad = [path for path in paths if not path.startswith(allowed)]
          if bad:
              raise SystemExit('Zenodo sync write membrane violated by: ' + ', '.join(bad))
          print(f'SRC live-path membrane PASS ({len(paths)} changed paths)')
          PY
          [[ "$(git rev-parse HEAD:$SRC_ROOT/04-RECEIPTS/phase2)" == "$BEFORE_PHASE2_TREE" ]]
          [[ "$(git rev-parse HEAD:$SRC_ROOT/01-MANIFESTS/phase2)" == "$BEFORE_PHASE2_MANIFEST_TREE" ]]

      - name: Commit one bounded SRC live-intake packet
        id: src_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in \
            "$SRC_ROOT/01-MANIFESTS/live" \
            "$SRC_ROOT/02-ORIGINALS/live" \
            "$SRC_ROOT/03-DERIVATIVES/text/live" \
            "$SRC_ROOT/04-RECEIPTS/live"; do
            [[ -e "$path" ]] && git add -A -- "$path"
          done
          git diff --cached --quiet && { echo 'No SRC live intake changes were produced.' >&2; exit 1; }
          git commit -m "src: operator Zenodo delta sync run $GITHUB_RUN_ID"
          AFTER_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:$ATELIER_BRANCH"
          echo "after_sha=$AFTER_SHA" >> "$GITHUB_OUTPUT"

      - name: Record completed SRC sync and return gate to dormant
        if: success()
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.src_before.outputs.head }}
          AFTER_SHA: ${{ steps.src_commit.outputs.after_sha }}
        run: |
          set -euo pipefail
          COUNT="$(jq -r '.new_record_count' "$SYNC_SUMMARY")"
          IDS="$(jq -r '.new_record_ids | join(", ")' "$SYNC_SUMMARY")"
          PARTIAL="$(jq -r '.partial_body_extraction_record_ids | join(", ")' "$SYNC_SUMMARY")"
          [[ -n "$IDS" ]] || IDS='none'
          [[ -n "$PARTIAL" ]] || PARTIAL='none'
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Zenodo delta sync complete.

          \`\`\`text
          run = $GITHUB_RUN_ID
          before_head = $BEFORE_SHA
          after_head = $AFTER_SHA
          new_record_count = $COUNT
          new_record_ids = $IDS
          partial_body_extraction = $PARTIAL
          target = $ATELIER_BRANCH / PR #$ATELIER_PR
          sealed_phase2_mutation = false
          A15-R0_scientific_mutation = false
          merge = false
          publication = false
          production = false
          \`\`\`

          Gate #$GATE_ISSUE returns to **DORMANT**. A later sync requires a fresh explicit operator gesture. ⟐
          EOF_COMMENT
          )"

      - name: Record held SRC sync
        if: failure()
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" \
            -f body="$(cat <<EOF_COMMENT
          𝌋 Zenodo delta sync **HELD**.

          \`\`\`text
          run = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          target = $ATELIER_BRANCH / PR #$ATELIER_PR
          repository_push_after_failure = not authorized
          automatic_retry = not authorized
          \`\`\`

          The gate returns to **DORMANT**. A failed run creates no retry, merge, seal, publication, or production authority. ⟐
          EOF_COMMENT
          )"

  wendbine-operator-sync:
    # Separate from SRC #758. A new comment is required for each bounded pass.
    if: >-
      github.event.issue.number == 1308 &&
      github.event.issue.pull_request == null &&
      (github.event.comment.user.login == github.repository_owner || github.event.comment.user.login == 'chatgpt-codex-connector[bot]') &&
      github.event.comment.body == '/wendbine-sync ATELIER'
    permissions:
      contents: write
      issues: write
      pull-requests: read
    # Isolated from Vercel release and SRC; never cancel a running capture.
    concurrency:
      group: wendbine-operator-sync-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GATE_ISSUE: '1308'
      ATELIER_PR: '1134'
      ATELIER_BRANCH: research/wendbine-public-atelier-sync-20260913
      WENDBINE_ROOT: packages/dome_world_exact/fixtures/a15-r0/WENDBINE
      SYNC_RECEIPT: /tmp/wendbine-operator-sync-receipt.json
    steps:
      - name: Accept exactly one operator gesture
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" -f body="𝌋 Wendbine sync accepted. command=/wendbine-sync ATELIER; gesture=${{ github.event.comment.id }}; run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; scope=one bounded archival discovery; gate=RUNNING. No merge, deployment, scientific promotion or automatic retry. ⟐"
      - name: Verify exact research branch and PR state
        id: before
        shell: bash
        run: |
          set -euo pipefail
          data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ATELIER_PR")"
          [[ "$(jq -r '.state' <<<"$data")" == open ]]
          [[ "$(jq -r '.merged' <<<"$data")" == false ]]
          [[ "$(jq -r '.head.ref' <<<"$data")" == "$ATELIER_BRANCH" ]]
          echo "head=$(jq -r '.head.sha' <<<"$data")" >> "$GITHUB_OUTPUT"
      - name: Checkout exact inspected Atelier head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.before.outputs.head }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Wendbine sync and sealed-query contract
        shell: bash
        run: |
          set -euo pipefail
          node --check "$WENDBINE_ROOT/99-ADMIN/wendbine-src-autosync.mjs"
          node tests/wendbine-src-autosync.test.mjs
          node tests/wendbine-srcquery.test.mjs
      - name: Acquire bounded archive and prepare sealed private handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wendbine-private"
          node "$WENDBINE_ROOT/99-ADMIN/wendbine-src-autosync.mjs" \
            --output-root "$WENDBINE_ROOT" \
            --encrypted-output "$RUNNER_TEMP/wendbine-private/source-capture.sealed.json" \
            > "$SYNC_RECEIPT"
          test -s "$RUNNER_TEMP/wendbine-private/source-capture.sealed.json"
          jq '{atelier_snapshot_id,seal_id,observed,new,changed,unchanged,not_seen_prior,held,encrypted_handoff_created}' "$SYNC_RECEIPT"
      - name: Preserve ciphertext outside public source tree
        uses: actions/upload-artifact@v4
        with:
          name: wendbine-operator-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/wendbine-private/source-capture.sealed.json
          retention-days: 90
          if-no-files-found: error
      - name: Enforce source-specific append-only public write membrane
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          prefix='packages/dome_world_exact/fixtures/a15-r0/WENDBINE/'
          allowed_dirs=('01-MANIFESTS/phase2/', '04-RECEIPTS/phase2/',
             '05-OPERATIONS/phase2/', '07-ARCHIVE-LEDGER/syncs/')
          allowed_files=('01-MANIFESTS/registry-index.json',
             '05-OPERATIONS/relations/typed-edges.jsonl')
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z','--untracked-files=all'])
          paths=[line[3:] for line in raw.decode('utf8',errors='surrogateescape').split('\0') if line]
          bad=[p for p in paths if not p.startswith(prefix) or not (p[len(prefix):] in allowed_files or p[len(prefix):].startswith(allowed_dirs))]
          if bad:raise SystemExit('WENDBINE_WRITE_MEMBRANE_VIOLATION:'+repr(bad))
          if not paths:raise SystemExit('WENDBINE_RUN_RECEIPT_MISSING')
          print('Wendbine-only write membrane PASS',len(paths))
          PY
      - name: Commit one bounded Atelier epoch to research branch
        id: committed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$WENDBINE_ROOT/01-MANIFESTS/phase2" \
            "$WENDBINE_ROOT/01-MANIFESTS/registry-index.json" \
            "$WENDBINE_ROOT/04-RECEIPTS/phase2" \
            "$WENDBINE_ROOT/05-OPERATIONS/phase2" \
            "$WENDBINE_ROOT/05-OPERATIONS/relations/typed-edges.jsonl" \
            "$WENDBINE_ROOT/07-ARCHIVE-LEDGER/syncs"
          git diff --cached --quiet && { echo NO_SYNC_RECEIPT_TO_COMMIT >&2; exit 1; }
          git commit -m "wendbine: operator source sync $GITHUB_RUN_ID"
          after="$(git rev-parse HEAD)"
          git push origin "HEAD:$ATELIER_BRANCH"
          echo "head=$after" >> "$GITHUB_OUTPUT"
      - name: Receipt successful run and return gate to DORMANT
        if: success()
        shell: bash
        env:
          BEFORE_SHA: ${{ steps.before.outputs.head }}
          AFTER_SHA: ${{ steps.committed.outputs.head }}
        run: |
          set -euo pipefail
          summary="$(jq -c '{atelier_snapshot_id,seal_id,observed,new,changed,unchanged,not_seen_prior,held,encrypted_handoff_created}' "$SYNC_RECEIPT")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" -f body="𝌋 Wendbine bounded public-projection sync complete. run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; before=$BEFORE_SHA; after=$AFTER_SHA; summary=$summary; encrypted_handoff=wendbine-operator-encrypted-$GITHUB_RUN_ID; private_source_custody=PENDING_DURABLE_PRIVATE_TRANSFER; artifact_retention_days=90; exact_head_validation=PENDING_CI; archive_version_not_live_state=true; merge=false; production=false; scientific_promotion=false. Gate #$GATE_ISSUE DORMANT. Fresh gesture required for next sync. ⟐"
      - name: Record HELD and return gate to DORMANT
        if: failure()
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$GATE_ISSUE/comments" -f body="𝌋 Wendbine sync HELD. run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; automatic_retry=false; merge=false; deployment=false; scientific_promotion=false. Gate #$GATE_ISSUE DORMANT. ⟐"

  # PR #1730 source-only preflight: no Vercel credentials, no deployment.

  vixen-preview-prepare:
    name: Exact-source GitHub preflight — NO DEPLOY
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1730 &&
      github.event.issue.pull_request != null &&
      (
        github.event.comment.user.login == github.repository_owner ||
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
      ) &&
      startsWith(github.event.comment.body, '/td613-vixen-preview PREPARE ')
    concurrency:
      group: td613-vixen-pr1730-preview-prepare
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MANUAL_SHA: ${{ inputs.commit_sha || '' }}
      COMMENT_BODY: ${{ github.event.comment.body || '' }}
      VERCEL_SCOPE: tauric-diana-s-projects
      VERCEL_PROJECT: td-613-tcp
      VERCEL_ORG_ID: team_pX5L7AFivMzMU1lH28Y6RIhX
      VERCEL_CLI_VERSION: '65.16.0'

    steps:
      - name: Qualify request, exact PR HEAD and all consolidated CI jobs
        id: qualify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INPUT_SHA="$MANUAL_SHA"
          if [[ "$GITHUB_EVENT_NAME" == 'issue_comment' ]]; then
            read -r COMMAND OP INPUT_SHA EXTRA <<< "$COMMENT_BODY"
            [[ "$COMMAND" == '/td613-vixen-preview' && "$OP" == 'PREPARE' && -z "$EXTRA" ]] || exit 1
          fi
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Exact 40-character SHA required.' >&2; exit 1; }
          PR="$(gh api "repos/$GITHUB_REPOSITORY/pulls/1730")"
          jq -e --arg sha "$INPUT_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .merged == false and .head.sha == $sha and
             .head.ref == "research/vixen-dual-estate-encyclopedia-20261108" and
             .head.repo.full_name == $repo and .base.ref == "main"' \
            <<< "$PR" >/dev/null || { echo 'PR #1730 head mismatch.' >&2; exit 1; }
          RUNS="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/td613-ci.yml/runs" \
            -f head_sha="$INPUT_SHA" -f per_page=30)"
          CI_RUN="$(jq -r --arg sha "$INPUT_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")][0].id // empty' \
            <<< "$RUNS")"
          [[ -n "$CI_RUN" ]] || { echo 'No exact-HEAD GREEN consolidated CI.' >&2; exit 1; }
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?per_page=100")"
          jq -e '([.jobs[] | select(.conclusion != "skipped")] | length) >= 5 and ([.jobs[] | select(.conclusion != "skipped") | .conclusion] | all(. == "success"))' \
            <<< "$JOBS" >/dev/null || { echo 'Consolidated validation incomplete.' >&2; exit 1; }
          echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          echo "ci_run=$CI_RUN" >> "$GITHUB_OUTPUT"

      - name: Check out immutable PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.qualify.outputs.sha }}
          persist-credentials: false

      - name: Assert exact SHA, locked git deployment and required assets
        env:
          EXPECTED_SHA: ${{ steps.qualify.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          if (JSON.parse(fs.readFileSync('vercel.json','utf8')).git?.deploymentEnabled !== false)
            throw new Error('Existing Git auto-deploy lock must remain closed.');
          for (const p of [
            'app/encyclopedia/vix-cyb.html',
            'app/encyclopedia/vixen-estate/observatory-electric-foundry.mjs',
            'app/encyclopedia/vixen-estate/synthesis-salon.mjs',
            'app/encyclopedia/assets/vixen/fox-arcflash.svg'
          ]) if (!fs.existsSync(p)) throw new Error('Missing Vixen asset: '+p);
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies without Vercel credentials
        run: npm ci

      - name: Record delegated provider boundary — no Vercel authentication or build
        shell: bash
        run: |
          set -euo pipefail
          echo 'Source and exact-head CI verified. Provider step reserved to Kenough using working Antigravity Vercel access.'
          echo 'GitHub VERCEL_TOKEN confirmed unusable by run 43786830123 (User not found 404).'
          echo 'No project link, pull, build, deploy, alias change, or production action executed here.'

      - name: Revalidate current PR head and emit nonsecret PREPARED receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.qualify.outputs.sha }}
          CI_RUN: ${{ steps.qualify.outputs.ci_run }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/pulls/1730" --jq '.head.sha')"
          [[ "$CURRENT" == "$EXPECTED_SHA" ]] || { echo 'PR HEAD moved; readiness invalidated.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/vixen-preview-preflight"
          cat > "$RUNNER_TEMP/vixen-preview-preflight/receipt.txt" <<EOF
          TD613 VIXEN PREVIEW — PREPARED ONLY
          repository=$GITHUB_REPOSITORY
          pr=1730
          exact_source_sha=$EXPECTED_SHA
          consolidated_ci_run=$CI_RUN
          prepare_run_id=$GITHUB_RUN_ID
          configured_existing_project=$VERCEL_PROJECT
          configured_existing_scope=$VERCEL_SCOPE
          github_source_preflight=SUCCESS
          vercel_local_build=NOT_PERFORMED
          external_vercel_qualification=REQUIRED
          vercel_deployment=NOT_PERFORMED
          preview_alias=UNCHANGED
          production=UNTOUCHED
          operator_review=REQUIRED
          EOF
          sha256sum vercel.json \
            app/encyclopedia/vix-cyb.html \
            app/encyclopedia/vixen-estate/observatory-electric-foundry.mjs \
            app/encyclopedia/vixen-estate/synthesis-salon.mjs \
            app/encyclopedia/assets/vixen/fox-arcflash.svg \
            > "$RUNNER_TEMP/vixen-preview-preflight/source-sha256.txt"
          {
            echo '### Vixen Preview PREPARED — human adjudication required'
            echo ''
            echo "PR #1730 SHA: $EXPECTED_SHA"
            echo "CI: $CI_RUN"
            echo "Preparation run ID: $GITHUB_RUN_ID"
            echo '**Exact-source CI qualified; Vercel-side preview build delegated to Kenough. Deployment, aliases and production untouched.**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized preparation receipt ONLY
        uses: actions/upload-artifact@v4
        with:
          name: vixen-preview-prepared-${{ steps.qualify.outputs.sha }}
          path: ${{ runner.temp }}/vixen-preview-preflight/
          retention-days: 14
          if-no-files-found: error

  # PR #1730 Preview deployment: separate explicit owner comment only.

  vixen-preview-deploy:
    name: Verified Vixen preview
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 1730 &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/td613-vixen-preview DEPLOY ')
    concurrency:
      group: td613-vixen-pr1730-preview-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: vixen-preview
    env:
      MANUAL_SHA: ${{ inputs.commit_sha || '' }}
      MANUAL_PREPARE_RUN: ${{ inputs.prepare_run_id || '' }}
      APPROVAL_COMMENT: ${{ github.event.comment.body || '' }}
      VERCEL_SCOPE: tauric-diana-s-projects
      VERCEL_PROJECT: td-613-tcp
      VERCEL_ORG_ID: team_pX5L7AFivMzMU1lH28Y6RIhX
      VERCEL_PROJECT_ID: prj_Zb6g9tqAr5iJSAFWGU4u4lof6oF7
      VERCEL_PREVIEW_ALIAS: td-613-tcp-git-research-vixen-du-4ba43a-tauric-diana-s-projects.vercel.app
      VERCEL_CLI_VERSION: '65.16.0'

    steps:
      - name: Enforce distinct OWNER approval and successful preflight receipt
        id: operator_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APPROVED_SHA="$MANUAL_SHA"
          PREPARE_RUN="$MANUAL_PREPARE_RUN"
          if [[ "$GITHUB_EVENT_NAME" == 'issue_comment' ]]; then
            read -r COMMAND OP APPROVED_SHA PREPARE_RUN EXTRA <<< "$APPROVAL_COMMENT"
            [[ "$COMMAND" == '/td613-vixen-preview' && "$OP" == 'DEPLOY' && -z "$EXTRA" ]] || {
              echo 'Operator deploy command must be exact.' >&2
              exit 1
            }
          fi
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Operator must approve an exact 40-character source SHA.' >&2
            exit 1
          }
          [[ "$PREPARE_RUN" =~ ^[0-9]{8,20}$ ]] || {
            echo 'Operator must identify a successful preparation run ID.' >&2
            exit 1
          }
          PREPARED="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN")"
          jq -e \
            '.name == "Vercel Relock Safety" and
             .head_branch == "main" and .status == "completed" and
             .conclusion == "success" and .event == "issue_comment"' \
            <<< "$PREPARED" >/dev/null || {
              echo 'Referenced preparation is not a successful trusted preflight run.' >&2
              exit 1
            }
          PREPARED_JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN/jobs?per_page=100")"
          jq -e 'any(.jobs[]?; .name == "Exact-source GitHub preflight — NO DEPLOY" and .conclusion == "success")' \
            <<< "$PREPARED_JOBS" >/dev/null || {
              echo 'Referenced run lacks successful Vixen source preflight.' >&2
              exit 1
            }
          ARTIFACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN/artifacts?per_page=100")"
          jq -e --arg receipt "vixen-preview-prepared-$APPROVED_SHA" \
            'any(.artifacts[]?; .name == $receipt and .expired == false)' \
            <<< "$ARTIFACTS" >/dev/null || {
              echo 'Missing exact-SHA nonexpired PREPARED receipt artifact.' >&2
              exit 1
            }
          echo "INPUT_SHA=$APPROVED_SHA" >> "$GITHUB_ENV"
          echo "PREPARE_RUN_ID=$PREPARE_RUN" >> "$GITHUB_ENV"
          echo "sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
          echo 'Human-authorized preview path accepted; production remains prohibited.'

      - name: Authorize exact PR head and completed consolidated CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full 40-character commit SHA is required.' >&2; exit 1; }
          PR="$(gh api "repos/$GITHUB_REPOSITORY/pulls/1730")"
          jq -e --arg sha "$INPUT_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .merged == false and
             .head.sha == $sha and
             .head.ref == "research/vixen-dual-estate-encyclopedia-20261108" and
             .head.repo.full_name == $repo and .base.ref == "main"' \
            <<< "$PR" >/dev/null || { echo 'SHA is not the current, same-repository PR #1730 HEAD.' >&2; exit 1; }

          RUNS="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/td613-ci.yml/runs" \
            -f head_sha="$INPUT_SHA" -f per_page=30)"
          RUN_ID="$(jq -r --arg sha "$INPUT_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")][0].id // empty' \
            <<< "$RUNS")"
          [[ -n "$RUN_ID" ]] || { echo 'No successful exact-head consolidated validation was found.' >&2; exit 1; }
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          jq -e '([.jobs[] | select(.conclusion != "skipped")] | length) >= 5 and ([.jobs[] | select(.conclusion != "skipped") | .conclusion] | all(. == "success"))' \
            <<< "$JOBS" >/dev/null || { echo 'Expected all consolidated validation jobs to pass.' >&2; exit 1; }
          echo "Authorized PR #1730 SHA=$INPUT_SHA with consolidated CI run $RUN_ID"

      - name: Checkout the authorized immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.operator_gate.outputs.sha }}
          persist-credentials: false

      - name: Verify checked-out SHA and deployment lock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$INPUT_SHA" ]] || exit 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled !== false) {
            throw new Error('Git auto-deployment lock must remain closed.');
          }
          for (const path of [
            'app/encyclopedia/vix-cyb.html',
            'app/encyclopedia/vixen-estate/observatory-electric-foundry.mjs',
            'app/encyclopedia/vixen-estate/synthesis-salon.mjs',
            'app/encyclopedia/assets/vixen/fox-arcflash.svg'
          ]) {
            if (!fs.existsSync(path)) throw new Error('Missing Vixen route asset: ' + path);
          }
          NODE

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"

      - name: Install pinned uv for Python Vercel preview functions
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false

      - name: Confirm pinned uv executable
        run: uv --version

      - name: Verify existing Vercel account and project link
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$VERCEL_TOKEN" ]] || { echo 'VERCEL_TOKEN unavailable in GitHub Actions.' >&2; exit 1; }
          vercel whoami --scope "$VERCEL_SCOPE" >/dev/null
          # Read-only named-project existence check BEFORE link. Link --yes may create missing projects.
          vercel project inspect "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" >/dev/null
          vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          // Vercel CLI 65.16.0 may link directly from the two environment IDs
          // without writing .vercel/project.json. Validate both pinned IDs,
          // and validate the local link file if the CLI produced one.
          if (process.env.VERCEL_ORG_ID !== 'team_pX5L7AFivMzMU1lH28Y6RIhX' ||
              process.env.VERCEL_PROJECT_ID !== 'prj_Zb6g9tqAr5iJSAFWGU4u4lof6oF7') {
            throw new Error('Unexpected Vercel environment project or team ID.');
          }
          if (fs.existsSync('.vercel/project.json')) {
            const link = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
            if (link.orgId !== process.env.VERCEL_ORG_ID || link.projectId !== process.env.VERCEL_PROJECT_ID) {
              throw new Error('Vercel link resolved to an unexpected owner or project.');
            }
          }
          NODE
          vercel project inspect "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" >/dev/null

      - name: Build whole site as Preview only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview --scope "$VERCEL_SCOPE"
          vercel build --scope "$VERCEL_SCOPE"

      - name: Deploy immutable Preview without moving the familiar alias
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ steps.operator_gate.outputs.sha }}
          VERCEL_GIT_COMMIT_REF: research/vixen-dual-estate-encyclopedia-20261108
          VERCEL_GIT_REPO_SLUG: TD613-TCP
          VERCEL_GIT_REPO_OWNER: tauric-diana-613
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --archive=tgz --yes --scope "$VERCEL_SCOPE" | tee "$RUNNER_TEMP/vercel-preview-deploy.log"
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "$RUNNER_TEMP/vercel-preview-deploy.log" | tail -n 1)"
          [[ "$URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]] || { echo 'Invalid immutable preview URL.' >&2; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Confirm deployment READY and served source bytes
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          vercel inspect "$PREVIEW_URL" --wait --scope "$VERCEL_SCOPE" >/dev/null
          for relative in \
            encyclopedia/vix-cyb.html \
            encyclopedia/vixen-estate/observatory-electric-foundry.mjs \
            encyclopedia/vixen-estate/synthesis-salon.mjs \
            encyclopedia/assets/vixen/fox-arcflash.svg; do
            safe_name="$(printf '%s' "$relative" | tr / _)"
            vercel curl "/$relative" --deployment "$PREVIEW_URL" --scope "$VERCEL_SCOPE" > "$RUNNER_TEMP/$safe_name"
            cmp -s "app/$relative" "$RUNNER_TEMP/$safe_name" || {
              echo "Served bytes differ from PR source: $relative" >&2
              exit 1
            }
          done

      - name: Recheck HEAD and existing alias before reassignment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/pulls/1730" --jq '.head.sha')"
          [[ "$CURRENT_SHA" == "$INPUT_SHA" ]] || { echo 'PR head moved during build; alias preserved.' >&2; exit 1; }
          vercel inspect "https://$VERCEL_PREVIEW_ALIAS" --scope "$VERCEL_SCOPE" >/dev/null || {
            echo 'Established alias cannot be resolved in the expected team; alias preserved.' >&2
            exit 1
          }

      - name: Reassign only the established Vixen preview alias
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          vercel alias set "$PREVIEW_URL" "$VERCEL_PREVIEW_ALIAS" --scope "$VERCEL_SCOPE"
          {
            echo '### Vixen Cybernetics preview deployed'
            echo ''
            echo "Authorized commit: $INPUT_SHA"
            echo "Immutable preview: $PREVIEW_URL/encyclopedia/vix-cyb.html"
            echo "Established preview alias: https://$VERCEL_PREVIEW_ALIAS/encyclopedia/vix-cyb.html"
            echo ''
            echo 'Target: PREVIEW. Git deployment lock preserved. Production not changed.'
          } >> "$GITHUB_STEP_SUMMARY"
